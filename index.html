<title>晚上十點下課 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 版面概念：入夜的補習班樓層是底；上方是教室時鐘，下一步像便利貼貼在上緣，對話、說明、小遊戲都從下方像講義一樣滑出。 */
:root{
  --board:#e7e9e3;--surface:#ffffff;--ink:#1c2633;--muted:#5f6b78;--rule:#d3d8cf;
  --cta:#c9302a;--blue:#1d4fc4;--red:#c9302a;--green:#1f7a4a;--amber:#b7791f;--tray:#eef0ea;
  --glass:rgba(246,247,243,.93);--scrim:rgba(14,18,24,.55);
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --board:#151a20;--surface:#1c222a;--ink:#e6e9e3;--muted:#9aa5b0;--rule:#2f3741;
  --cta:#d63b31;--blue:#86a6ff;--red:#ff8577;--green:#6fd39a;--amber:#f0b45a;--tray:#232b34;
  --glass:rgba(23,28,35,.93);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --board:#151a20;--surface:#1c222a;--ink:#e6e9e3;--muted:#9aa5b0;--rule:#2f3741;
  --cta:#d63b31;--blue:#86a6ff;--red:#ff8577;--green:#6fd39a;--amber:#f0b45a;--tray:#232b34;
  --glass:rgba(23,28,35,.93);--scrim:rgba(0,0,0,.6);color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--board);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{touch-action:manipulation}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block}
.in{max-width:680px;margin:0 auto}

/* 上方時鐘列 */
.hud{position:fixed;left:0;right:0;top:0;z-index:6;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--glass);border-bottom:1px solid var(--rule);backdrop-filter:blur(6px)}
.bar-row{display:flex;align-items:center;gap:10px}
.clockbox{min-width:0}
.clock{font-family:var(--mono);font-weight:700;font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.05}
.clocksub{font-size:.72rem;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:.72rem;padding:3px 8px;border:1px solid var(--rule);border-radius:3px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.pill.ok i{background:var(--green)}.pill.bad i{background:var(--red)}
.hbtn{background:none;border:none;border-left:1px solid var(--rule);padding:4px 10px;font-size:.88rem;white-space:nowrap}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.meter{min-width:0}
.meter .lab{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted)}
.meter .lab b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.track{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:1px}
.fill{height:100%;background:var(--blue);transition:width .5s}
.meter.low .fill{background:var(--red)}.meter.low .lab b{color:var(--red)}

/* 下一步 */
.next{position:fixed;left:0;right:0;z-index:5;pointer-events:none;padding:0 16px}
.next .in{display:flex;justify-content:center}
.nextcard{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:100%;background:var(--glass);border:1px solid var(--rule);border-radius:6px;padding:6px 6px 6px 8px;box-shadow:0 4px 18px rgba(0,0,0,.12);backdrop-filter:blur(6px)}
.tag{font-size:.7rem;font-weight:700;background:var(--amber);color:#1c1408;padding:2px 6px;border-radius:3px;white-space:nowrap}
.nextcard .g{font-size:.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nextcard button{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:4px 10px;font-size:.85rem;white-space:nowrap}

/* 下方：方向鍵與動作鈕 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px))}
.dock .in{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.dpad{pointer-events:auto;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px}
.dpad button{background:var(--glass);border:1px solid var(--rule);border-radius:6px;font-size:1rem;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.keys{font-size:.74rem;color:var(--muted);background:var(--glass);padding:4px 8px;border-radius:4px}
.act{pointer-events:auto;background:var(--cta);color:#fff;border:none;border-radius:6px;padding:14px 20px;font-weight:700;font-size:1rem;box-shadow:0 6px 18px rgba(201,48,42,.35)}
.act.info{background:var(--ink);color:var(--board);box-shadow:none}

/* 對話框 */
.dlg{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.box{max-width:620px;margin:0 auto;background:var(--surface);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 36px rgba(0,0,0,.22);padding:14px 16px;max-height:min(68vh,560px);overflow:auto}
.spk{display:flex;align-items:center;gap:10px}
.face{width:38px;height:38px;border-radius:5px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;flex:none;font-size:1rem}
.face.sys{background:var(--tray);color:var(--ink);border:1px solid var(--rule)}
.spk b{display:block;font-family:var(--display);font-size:1.08rem;line-height:1.2}
.spk small{display:block;font-size:.74rem;color:var(--muted)}
.say{margin:10px 0 0;font-size:1.02rem}
.say.narr{border-left:3px solid var(--rule);padding-left:10px}
.term{background:none;border:none;padding:0;border-bottom:1.5px dotted var(--amber);font-weight:500}
.tip{margin-top:10px;font-size:.76rem;color:var(--muted);border:1px solid var(--amber);border-radius:3px;padding:3px 8px}
.foot{margin-top:12px;display:flex;align-items:center;gap:8px}
.pg{font-family:var(--mono);font-size:.74rem;color:var(--muted);flex:1}
.go{background:var(--cta);color:#fff;border:none;border-radius:4px;padding:9px 18px;font-weight:700}
.skip{background:none;border:1px solid var(--rule);border-radius:4px;padding:8px 12px}
.choices{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:var(--tray);border:1px solid var(--rule);border-radius:4px;padding:11px 13px;line-height:1.45}
.choice:hover{border-color:var(--ink)}
.choice small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.deltas{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.d{font-family:var(--mono);font-size:.74rem;padding:1px 7px;border-radius:3px;border:1px solid currentColor}
.d.up{color:var(--green)}.d.down{color:var(--red)}

/* 說明／小遊戲面板 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--surface);border-top:1px solid var(--rule);border-radius:10px 10px 0 0;max-height:82%;overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet-bg{position:fixed;inset:0;z-index:11;background:var(--scrim)}
.shead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:10px}
.shead span{font-size:.85rem;font-weight:700}
.close{background:var(--tray);border:1px solid var(--rule);border-radius:4px;padding:3px 10px;font-size:.82rem}
.zone{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--muted)}
.sheet h3{font-family:var(--display);font-size:1.4rem;margin:2px 0 6px}
.sheet p{margin:0 0 8px}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:6px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:.76rem;border-bottom:1px solid var(--rule);padding:4px 6px 4px 0}
.tbl td{border-bottom:1px solid var(--rule);padding:7px 6px 7px 0;vertical-align:top}
.tbl td small{display:block;color:var(--muted);font-size:.74rem}
.lamp{white-space:nowrap}
.lamp i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.lamp.r i{background:var(--red)}.lamp.y i{background:var(--amber)}.lamp.g i{background:var(--green)}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid var(--rule);border-radius:999px;padding:3px 12px;font-size:.85rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--board);border-color:var(--ink)}
dl.list{margin:0}
dl.list dt{font-family:var(--display);font-weight:700;margin-top:10px}
dl.list dd{margin:0;color:var(--muted);font-size:.9rem}

/* 卡紙小遊戲 */
.jam{margin:10px 0 6px;background:var(--tray);border:1px solid var(--rule);border-radius:8px;padding:16px 10px}
.jam-path{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:center}
.jam-cap{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-top:8px}
.slot{aspect-ratio:3/4;max-width:100%;border-radius:4px;border:1px dashed var(--rule);display:grid;place-items:center;position:relative}
.sheetp{width:100%;height:100%;border-radius:3px;background:var(--surface);border:1px solid var(--muted);box-shadow:2px 2px 0 rgba(0,0,0,.08);font-size:.7rem;color:var(--muted);display:grid;place-items:center;transition:transform .25s,opacity .25s}
.sheetp.crumple{background:repeating-linear-gradient(135deg,var(--surface) 0 6px,var(--tray) 6px 9px)}
.sheetp.gone{opacity:0;transform:translateX(30px) rotate(8deg)}
.sheetp.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.roller{position:absolute;bottom:-9px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--muted)}
.feed{min-height:1.7em;font-size:.92rem}

/* 批考卷小遊戲 */
.paper{margin:10px 0;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;font-family:var(--display);font-size:1.05rem}
.paper .q{font-family:var(--body);font-size:.88rem;color:var(--muted);margin-bottom:6px}
.stepl{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px dashed var(--rule);padding:8px 4px;font-family:var(--mono);font-size:.92rem}
.stepl.hit{background:color-mix(in srgb,var(--red) 14%,transparent);text-decoration:line-through;text-decoration-color:var(--red)}
.stepl.miss{opacity:.5}

/* 全螢幕卡片 */
.cover{position:fixed;inset:0;z-index:20;background:var(--scrim);overflow:auto;padding-inline:16px;padding-block:calc(24px + env(safe-area-inset-top,0px)) 24px;display:grid;place-items:center}
.card{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:22px 20px}
.ticker{font-family:var(--mono);font-size:.78rem;background:var(--ink);color:var(--board);padding:7px 10px;border-radius:4px;display:flex;gap:12px;flex-wrap:wrap}
.ticker .r{color:var(--red)}
.card h1{font-family:var(--display);font-size:clamp(2.2rem,9vw,3rem);line-height:1.1;margin:14px 0 2px;text-wrap:balance}
.card h1 em{font-style:normal;color:var(--red)}
.card .lede{font-weight:700;letter-spacing:.12em;color:var(--muted);margin:0}
.lbl{font-size:.74rem;letter-spacing:.12em;color:var(--muted);margin:16px 0 6px}
.cast{display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.cast div{display:flex;gap:8px;align-items:baseline}
.cast i{width:10px;height:10px;border-radius:2px;flex:none;transform:translateY(1px)}
.cast b{font-family:var(--display)}
.cast span{color:var(--muted)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.role{text-align:left;background:var(--tray);border:1px solid var(--rule);border-radius:6px;padding:10px;min-width:0}
.role b{display:block;font-family:var(--display);font-size:1.05rem}
.role small{display:block;color:var(--muted);font-size:.76rem;line-height:1.4}
.role[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.role[disabled]{opacity:.5;cursor:not-allowed}
.big-go{display:block;width:100%;margin-top:16px;background:var(--cta);color:#fff;border:none;border-radius:6px;padding:14px;font-size:1.15rem;font-weight:700;font-family:var(--display);letter-spacing:.3em}
.hint{font-size:.8rem;color:var(--muted);margin-top:10px}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.links button{background:none;border:none;padding:0;text-decoration:underline;font-size:.9rem}

.chap{text-align:center;color:#fff;max-width:420px}
.chap .t{font-family:var(--mono);color:#f0b45a;font-size:.95rem}
.chap h2{font-family:var(--display);font-size:2.2rem;margin:4px 0}
.chap p{opacity:.85;margin:0 0 16px}
.chap .rush{text-align:left;margin:0 0 16px;display:flex;flex-direction:column;gap:6px}
.chap .rush div{border-left:3px solid #f0b45a;padding-left:10px}
.chap .rush div:first-child{border-color:#ff8577}
.chap button{background:none;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:4px;padding:8px 20px}
.cover.dark{background:rgba(8,10,14,.82)}

.report h2{font-family:var(--display);font-size:1.9rem;margin:6px 0 4px}
.kick{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;color:var(--muted)}
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.big div{border-top:2px solid var(--ink);padding-top:6px;min-width:0}
.big b{font-family:var(--mono);font-size:1.6rem;display:block;line-height:1.2}
.big span{font-size:.78rem;color:var(--muted)}
.log{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.log li{display:grid;grid-template-columns:3.4em 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:.86rem}
.log li span{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.primary{background:var(--ink);color:var(--board);border:none;border-radius:4px;padding:10px 16px;font-weight:500}
.ghost{background:none;border:1px solid var(--rule);border-radius:4px;padding:9px 14px}
.toast{font-size:.85rem;color:var(--green)}
.banner{position:fixed;left:50%;transform:translateX(-50%);z-index:7;background:var(--glass);border:1px solid var(--rule);border-left:4px solid var(--green);border-radius:4px;padding:6px 12px;font-size:.86rem;max-width:calc(100% - 32px);backdrop-filter:blur(6px)}
.banner b{display:block;font-family:var(--display)}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,.sheetp.shake{animation:none}.sheetp{transition:none}}
@media (max-width:440px){.meters{grid-template-columns:repeat(2,1fr);gap:2px 14px}.clock{font-size:1.25rem}.hbtn{padding:4px 7px}.roles{grid-template-columns:1fr}}

.due{color:var(--muted)}.due.warn{color:var(--amber);font-weight:700}.due.late{color:var(--red);font-weight:700}
</style>
<div id="stage" aria-label="補習班樓層"></div>
<div class="hud"><div class="in" id="hud"></div></div>
<div class="next" id="next" hidden></div>
<div class="dock" id="dock" hidden><div class="in">
  <div id="dpad" class="dpad" aria-label="方向鍵"><button class="u" data-k="u" aria-label="上">▲</button><button class="l" data-k="l" aria-label="左">◀</button><button class="r" data-k="r" aria-label="右">▶</button><button class="d" data-k="d" aria-label="下">▼</button></div>
  <span class="keys" id="keys">WASD／方向鍵走路・點地板走過去・E 互動</span>
  <button class="act" id="actBtn" hidden>互動</button>
</div></div>
<div class="banner" id="banner" hidden></div>
<div class="dlg" id="dlg" hidden></div>
<div class="sheet-bg" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="sheet" id="termPop" role="dialog" style="z-index:40" hidden></div>
<div class="cover" id="cover"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
/* ================= 共用資料 ================= */
const CHARS={
 yun:{name:"小芸",short:"班導",title:"櫃台・班導",abbr:"班",color:"#1f9c86",body:0x2fb39a,hair:0x3a2a22},
 boss:{name:"何主任",short:"主任",title:"補習班主任",abbr:"主",color:"#c2457f",body:0x2f3a4a,hair:0x8a8a8a},
 teacher:{name:"許老師",short:"數學",title:"高三數學老師",abbr:"師",color:"#b7791f",body:0xf0f0f0,hair:0x2a2421},
 pinyu:{name:"品妤",short:"高三B",title:"高三 B 班",abbr:"生",color:"#3d6fd8",body:0x7a9cc6,hair:0x1f1b18},
 zhe:{name:"阿哲",short:"高三B",title:"高三 B 班・最後一排",abbr:"生",color:"#5c6370",body:0x3d3d3d,hair:0x1a1a1a},
 parent:{name:"王媽媽",short:"試聽家長",title:"試聽生家長",abbr:"家",color:"#8b5cc7",body:0xa77fd6,hair:0x4a3a2e},
 parent2:{name:"試聽生",short:"高三",title:"試聽生",abbr:"生",color:"#5c7d78",body:0x6f8f8a,hair:0x2a2421},
 mom:{name:"林媽媽",short:"家長",title:"阿哲的媽媽・電話中",abbr:"☎",color:"#c06a2b"},
 hong:{name:"阿宏",short:"助教",title:"自習室助教・大三",abbr:"助",color:"#2f7d4f",body:0x5c9d6a,hair:0x222222},
 deliv:{name:"外送員",short:"外送",title:"外送平台",abbr:"送",color:"#d9480f",body:0xe8590c,hair:0x222222},
 chenba:{name:"陳爸爸",short:"家長",title:"高一 C 家長",abbr:"家",color:"#6b7f3a",body:0x7d8f4a,hair:0x333333},
 bo:{name:"小柏",short:"高一C",title:"高一 C・自習室常客",abbr:"生",color:"#2e86ab",body:0x4aa3c7,hair:0x1a1a1a}
};

const TERMS={
 "學測":"大學學科能力測驗，每年一月考。高三生升大學最重要的一場考試，數學滿分 15 級分。",
 "級分":"學測的計分方式，每科 0 到 15 級分。模考也照這個換算，家長和學生都用級分講成績。",
 "模考":"模擬考。補習班或出版社出的仿學測考試，成績會被拿來和上一次比較。",
 "試聽":"還沒報名的學生先來上一兩堂課，看合不合適。家長常常會一起坐在教室裡。",
 "續班":"學生上完這一期，繼續報下一期。補習班最在意的數字之一。",
 "續班率":"這一期的學生裡，有多少比例報了下一期。主任辦公室牆上那個數字。",

function blockedAt(x,z,r=R){if(x<r||z<r||x>W-r||z>H-r)return true;for(const s of solids){if(x>s[0]-r&&x<s[2]+r&&z>s[1]-r&&z<s[3]+r)return true;}return false;}
function buildGrid(){gridB=new Uint8Array(GW*GH);for(let j=0;j<GH;j++)for(let i=0;i<GW;i++)gridB[j*GW+i]=blockedAt((i+.5)*CELL,(j+.5)*CELL)?1:0;}
const cellOf=(x,z)=>[Math.max(0,Math.min(GW-1,Math.floor(x/CELL))),Math.max(0,Math.min(GH-1,Math.floor(z/CELL)))];
function nearestFree(i,j){if(!gridB[j*GW+i])return[i,j];for(let r=1;r<40;r++)for(let dj=-r;dj<=r;dj++)for(let di=-r;di<=r;di++){if(Math.max(Math.abs(di),Math.abs(dj))!==r)continue;const a=i+di,b=j+dj;if(a>=0&&b>=0&&a<GW&&b<GH&&!gridB[b*GW+a])return[a,b];}return[i,j];}
function los(ax,az,bx,bz){const d=Math.hypot(bx-ax,bz-az),n=Math.ceil(d/.05);for(let k=1;k<=n;k++){const t=k/n;if(blockedAt(ax+(bx-ax)*t,az+(bz-az)*t,R+.07))return false;}return true;}
function findPath(tx,tz){return findPathFrom(player.position.x,player.position.z,tx,tz);}
function findPathFrom(fx,fz,tx,tz){
  const [si,sj]=nearestFree(...cellOf(fx,fz)),[gi,gj]=nearestFree(...cellOf(tx,tz));
  const N=GW*GH,g=new Float32Array(N).fill(1e9),prev=new Int32Array(N).fill(-1),closed=new Uint8Array(N),s=sj*GW+si,goal=gj*GW+gi;g[s]=0;
  const h=k=>Math.hypot(k%GW-gi,Math.floor(k/GW)-gj);const open=[s];
  while(open.length){let bi=0,bf=g[open[0]]+h(open[0]);for(let k=1;k<open.length;k++){const f=g[open[k]]+h(open[k]);if(f<bf){bf=f;bi=k;}}
    const cur=open[bi];open[bi]=open[open.length-1];open.pop();if(cur===goal)break;if(closed[cur])continue;closed[cur]=1;const ci=cur%GW,cj=Math.floor(cur/GW);
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){if(!di&&!dj)continue;const a=ci+di,b=cj+dj;if(a<0||b<0||a>=GW||b>=GH)continue;const k=b*GW+a;
      if(gridB[k]||closed[k])continue;if(di&&dj&&(gridB[cj*GW+a]||gridB[b*GW+ci]))continue;const ng=g[cur]+(di&&dj?1.414:1);if(ng<g[k]){g[k]=ng;prev[k]=cur;open.push(k);}}}
  if(prev[goal]<0&&goal!==s)return null;
  const pts=[];for(let k=goal;k!==-1&&k!==s;k=prev[k])pts.unshift([(k%GW+.5)*CELL,(Math.floor(k/GW)+.5)*CELL]);
  const out=[];let ax=fx,az=fz,i=0;while(i<pts.length){let j=pts.length-1;while(j>i&&!los(ax,az,pts[j][0],pts[j][1]))j--;out.push(pts[j]);[ax,az]=pts[j];i=j+1;}
  return out;
}

/* 環境音：冷氣低鳴、鐘聲、雨聲、電話鈴 */
let amb=null;
function ensureAudio(){if(!soundOn)return null;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){return null;}return actx;}
function noiseBuf(a,sec){const b=a.createBuffer(1,a.sampleRate*sec,a.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5;}return b;}
function startAmbient(){const a=ensureAudio();if(!a||amb)return;
  const src=a.createBufferSource();src.buffer=noiseBuf(a,4);src.loop=true;const f=a.createBiquadFilter();f.type="lowpass";f.frequency.value=380;const g=a.createGain();g.gain.value=.05;
  const hum=a.createOscillator();hum.frequency.value=60;const hg=a.createGain();hg.gain.value=.006;hum.connect(hg);hg.connect(a.destination);hum.start();
  src.connect(f);f.connect(g);g.connect(a.destination);src.start();amb={src,g,hum,hg};}
function stopAmbient(){if(!amb)return;try{amb.src.stop();amb.hum.stop();}catch(e){}amb=null;}
function chime(){const a=ensureAudio();if(!a)return;const notes=[659,523,587,392,392,587,659,523];let t0=a.currentTime+.05;
  notes.forEach(fq=>{const o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=fq;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.09,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.9);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+1);t0+=.42;});}
function rainSound(sec=8){const a=ensureAudio();if(!a)return;const s=a.createBufferSource();const b=a.createBuffer(1,a.sampleRate*2,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;s.buffer=b;s.loop=true;
  const f=a.createBiquadFilter();f.type="highpass";f.frequency.value=1200;const g=a.createGain();g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.06,a.currentTime+1);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+sec);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start();s.stop(a.currentTime+sec+.2);}
function ring(times=2){const a=ensureAudio();if(!a)return;let t0=a.currentTime+.05;for(let k=0;k<times;k++){for(let j=0;j<8;j++){const o=a.createOscillator(),g=a.createGain();o.frequency.value=j%2?440:480;g.gain.setValueAtTime(.05,t0);g.gain.setValueAtTime(0,t0+.05);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+.05);t0+=.05;}t0+=.6;}}
/* 雨：畫面上的雨滴 */
let rain=null;
function startRain(sec=10){if(rain)return;const n=500,geo=new THREE.BufferGeometry(),pos=new Float32Array(n*3);for(let i=0;i<n;i++){pos[i*3]=Math.random()*40-6;pos[i*3+1]=Math.random()*8;pos[i*3+2]=Math.random()*30-4;}
  geo.setAttribute("position",new THREE.BufferAttribute(pos,3));const pts=new THREE.Points(geo,new THREE.PointsMaterial({color:0x9fb4d8,size:.06,transparent:true,opacity:.7}));scene.add(pts);rain={pts,until:clockT.elapsedTime+sec};rainSound(sec);}
function tickRain(dt){if(!rain)return;const p=rain.pts.geometry.attributes.position;for(let i=0;i<p.count;i++){let y=p.getY(i)-dt*14;if(y<0)y=8;p.setY(i,y);}p.needsUpdate=true;if(clockT.elapsedTime>rain.until){scene.remove(rain.pts);rain=null;}}

function buildSteps(L){
  const steps=[...L.steps],slots=[...(EVENT_SLOTS[L.id]||[])].sort(()=>Math.random()-.5).slice(0,2),used=new Set();
  slots.forEach(sl=>{const pool=EVENTS.filter(e=>e.phases.includes(sl.phase)&&!used.has(e.id)&&!(e.id==="nosebleed"&&L.id!=="teacher"&&sl.phase!=="class"));
    if(!pool.length)return;const ev=pool[Math.floor(Math.random()*pool.length)];used.add(ev.id);
    const st={...ev.make(),id:"ev_"+ev.id,t:sl.t,isEvent:true};const i=steps.findIndex(s=>s.id===sl.after);if(i>=0)steps.splice(i+1,0,st);});
  return steps;
}

/* ================= 遊戲引擎 ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich=s=>esc(s).replace(/\[\[(.+?)\]\]/g,(m,t)=>`<button class="term" data-term="${t}">${t}</button>`);
const plain=s=>esc(String(s).replace(/\[\[|\]\]/g,""));
const val=(x,a)=>typeof x==="function"?x(a):x;
const clamp=v=>Math.max(0,Math.min(100,v));
const store={get(k,d){try{const v=localStorage.getItem("ten-pm:"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem("ten-pm:"+k,JSON.stringify(v));}catch(e){}}};

let guiding=false,G=null,mode="title",path=null,keys={},near=null,pickedLine=store.get("line","teacher"),clockT=new THREE.Clock();

/* ---------- 音效（第一次點擊後才會出聲） ---------- */
let soundOn=store.get("sound",true),actx=null;
function beep(kind){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();
  const seq={blip:[[660,.05]],pick:[[880,.08],[1320,.12]],chap:[[392,.18],[523,.28]],ok:[[523,.08],[659,.08],[784,.14]],bad:[[220,.16]],side:[[740,.07],[988,.1]]}[kind]||[[600,.05]];
  let t0=actx.currentTime;seq.forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.12,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+d+.02);t0+=d*.9;});}catch(e){}}
let seenSides=new Set(store.get("sides",[]));             // 各職業線的支線：SIDES[lineId]=[...]
let seenItems=new Set(store.get("items",[])),seenInfo=new Set(store.get("info",[])),doneLines=new Set(store.get("done",[]));

const toMin=s=>{const [h,m]=s.split(":").map(Number);return h*60+m;},fmt=m=>{m=Math.floor(m);return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");};
const MIN_PER_SEC=1/1.2;
function newGame(lineId){
  const L=LINES[lineId],name=(store.get("name","")||"").trim();
  const sur=name?(/^[一-鿿]/.test(name)?name[0]:name+" "):"許";
  G={line:L,idx:0,s:{},h:{...L.hidden},f:{},log:[],items:[],sidesDone:{},tName:lineId==="teacher"?sur+"老師":"許老師",pName:name||({yun:"小芸",boss:"何主任"}[lineId]||"你"),name,tipShown:false,status:"",time:"17:20",chapterTitle:""};
  for(const k in L.stats)G.s[k]=L.stats[k][1];
  G.steps=buildSteps(L);G.minis={};G.hard=doneLines.has(lineId);G.clock=toMin(G.steps[0].t);G.lates=0;G.lateMin=0;
  Object.defineProperty(G,"time",{get(){return fmt(G.clock);},set(v){},configurable:true});
  if(player)scene.remove(player);makePlayer(L);player.position.set(L.start[0],0,L.start[1]);player.rotation.y=Math.PI;
  Object.keys(CHARS).forEach(id=>{if(CHARS[id].body!==undefined)setNPC(id,null);});
  for(const id in L.npcs)if(CHARS[id]&&CHARS[id].body!==undefined)setNPC(id,val(L.npcs[id],G),true);
  Object.values(itemMarks).forEach(m=>scene.remove(m));for(const k in itemMarks)delete itemMarks[k];
  ITEMS.filter(it=>!it.lines||it.lines.includes(lineId)).forEach(addItemMark);
  for(const id in sideMarks){scene.remove(sideMarks[id]);delete sideMarks[id];}
  crowdPhase=null;setCrowd("pre",true);FX.shake=FX.dark=0;
  path=null;enterStep();
}
const step=()=>G.steps[G.idx];
function enterStep(){
  const st=step();if(!st)return finish();
  if(st.npc)for(const id in st.npc)setNPC(id,val(st.npc[id],G));
  G.clock=Math.max(G.clock,toMin(st.t));G.due=null;
  if(!st.auto){let nx=G.idx+1;while(G.steps[nx]&&G.steps[nx].auto)nx++;const nt=G.steps[nx]?toMin(G.steps[nx].t):22*60;G.due=Math.max(nt,G.clock+8);}
  if(st.chapter){G.status=st.chapter.status||G.status;G.chapterTitle=st.chapter.title;}
  setCrowd(phaseOf());saveGame();
  if(st.chapter)showChapter(st.chapter);
  else if(st.auto){mode="walk";renderAll();openStep();}
  else{mode="walk";renderAll();}
}
function nextStep(){const st=step();if(st&&st.after)for(const id in st.after)setNPC(id,val(st.after[id],G));G.idx++;path=null;enterStep();}

/* ---------- 目標與附近的東西 ---------- */
function targetOf(t){if(!t)return null;if(t.npc){const n=npcs[t.npc];return{x:n.position.x,z:n.position.z,h:n.userData.top+.85,name:CHARS[t.npc].name,kind:"npc",id:t.npc};}
  const s=SPOTS[t.spot];return{x:s.pos[0],z:s.pos[1],h:s.h+.5,name:s.name,kind:"spot"};}
function activeSides(){const list=SIDES[G.line.id]||[],ids=G.steps.map(s=>s.id);
  return list.filter(sd=>!G.sidesDone[sd.id]&&G.idx>=ids.indexOf(sd.from)&&G.idx<=ids.indexOf(sd.until)&&(!sd.avail||sd.avail(G)));}
function nearest(){
  const px=player.position.x,pz=player.position.z,d=(x,z)=>Math.hypot(x-px,z-pz),c=[];
  const m=targetOf(step().target);if(m){const dm=d(m.x,m.z);if(dm<1.9)c.push({dist:dm,type:"main",label:step().action||(m.kind==="npc"?`找${CHARS[m.id].name}`:`到${m.name}`)});}
  for(const sd of activeSides()){const t=targetOf(sd.target);if(t){const ds=d(t.x,t.z);if(ds<1.9)c.push({dist:ds,type:"side",sd,label:sd.action||`找${t.name}`});}}
  for(const it of ITEMS){if(itemMarks[it.id]&&!G.items.includes(it.id)){const di=d(it.pos[0],it.pos[1]);if(di<1.3)c.push({dist:di-.3,type:"item",it,label:"撿起來"});}}
  if(c.length){c.sort((a,b)=>a.dist-b.dist);return c[0];}
  for(const inf of INFO){if(d(inf.pos[0],inf.pos[1])<1.6)return{type:"info",inf,label:"看說明"};}
  return null;
}
function interact(){if(mode!=="walk"||!near)return;
  if(near.type==="main")openStep();else if(near.type==="side")openSide(near.sd);else if(near.type==="item")pickItem(near.it);else if(near.type==="info")openInfo(near.inf);}

/* ---------- HUD ---------- */
function renderAll(){renderHud();renderNext();renderDock();}
function renderHud(){
  if(!G){$("hud").innerHTML=`<div class="bar-row"><div class="clockbox"><div class="clock">17:20</div><div class="clocksub">高三數學 B 班</div></div><span class="spacer"></span><button class="hbtn" data-act="codex">圖鑑</button></div>`;return;}
  const L=G.line,low=k=>G.s[k]<25?"low":"";
  const st=G.status||"",cls=/上課/.test(st)?"ok":/下課|收拾/.test(st)?"":"bad";
  $("hud").innerHTML=`<div class="bar-row"><div class="clockbox"><div class="clock" id="clk">${mode==="end"?fmt(Math.max(G.clock,22*60+10)):G.time}</div><div class="clocksub" id="clksub">${dueText()}</div></div>
   <span class="spacer"></span><span class="pill ${cls}"><i></i>${esc(st)}</span><button class="hbtn" data-act="sound" aria-pressed="${soundOn}" aria-label="音效">${soundOn?"♪ 開":"♪ 關"}</button><button class="hbtn" data-act="home">主頁</button><button class="hbtn" data-act="codex">圖鑑</button></div>
   <div class="meters">${Object.keys(L.stats).map(k=>`<div class="meter ${low(k)}"><div class="lab"><span>${L.stats[k][0]}</span><b>${G.s[k]}</b></div><div class="track"><div class="fill" style="width:${G.s[k]}%"></div></div></div>`).join("")}</div>`;
  $("next").style.top=($(".hud")?document.querySelector(".hud").offsetHeight:80)+8+"px";
}
function dueText(){if(!G)return"";if(mode==="walk"&&G.due!=null){const r=Math.floor(G.due-G.clock);return r>=0?`<span class="due ${r<=3?"warn":""}">${fmt(G.due)} 前・剩 ${r} 分</span>`:`<span class="due late">已經晚了 ${-r} 分</span>`;}return `${esc(G.chapterTitle||"")}・${esc(G.line.role)}`;}
let lastClockMin=-1;
function tickClock(dt){if(!G||mode!=="walk")return;G.clock+=dt*MIN_PER_SEC;const m=Math.floor(G.clock);if(m!==lastClockMin){lastClockMin=m;const c=$("clk");if(c){c.textContent=G.time;$("clksub").innerHTML=dueText();}}}
function spend(min){if(G)G.clock+=min;}
function renderNext(){
  const el=$("next");if(mode!=="walk"){el.hidden=true;return;}el.hidden=false;
  el.innerHTML=`<div class="in"><div class="nextcard"><span class="tag">${G.due!=null?fmt(G.due)+" 前":"下一步"}</span><span class="g">${esc(step().goal)}</span><button data-act="guide">帶我去</button></div></div>`;
  $("next").style.top=document.querySelector(".hud").offsetHeight+8+"px";
}
function renderDock(){
  const d=$("dock");if(mode!=="walk"){d.hidden=true;return;}d.hidden=false;
  const touch=matchMedia("(pointer:coarse)").matches;
  $("dpad").hidden=!touch;$("keys").hidden=touch;
  const a=$("actBtn");a.hidden=!near;if(near){a.textContent=near.label;a.className="act"+(near.type==="info"?" info":"");}
}

function runDialog(o){D={i:0,...o};mode="dialog";path=null;guiding=false;renderAll();drawDialog();}
function drawDialog(){
  const p=D.pages[D.i],sp=speaker(p[0]),last=D.i===D.pages.length-1,n=D.pages.length;

  const showTip=!G.tipShown&&/\[\[/.test(p[1]);if(showTip)G.tipShown=true;

   <p class="say ${p[0]?"":"narr"}">${rich(p[1])}</p>${showTip?`<div class="tip">有虛線的詞可以點，會跳出白話解釋。</div>`:""}

   <div class="big" style="grid-template-columns:repeat(${Object.keys(G.s).length},1fr)">${Object.keys(G.s).map(k=>`<div><b style="font-size:1.1rem">${G.s[k]}</b><span>${G.line.stats[k][0]}</span></div>`).join("")}</div>
   <div class="lbl">準時</div><p style="margin:0">${G.lates?`遲到 ${G.lates} 次，一共 ${G.lateMin} 分鐘。`:"每一件事都準時到。"}</p>
   ${its.length?`<div class="lbl">今晚撿到</div><p style="margin:0">${its.map(i=>`${i.icon} ${esc(i.name)}`).join("　")}</p>`:""}
   <ol class="log">${G.log.map(([a,b])=>`<li><span>${esc(a)}</span>${esc(b)}</li>`).join("")}</ol>
   <div class="actions"><button class="primary" data-act="start">再上一天班</button><button class="ghost" data-act="copy">複製結算</button><button class="ghost" data-act="title">換個位子</button><span class="toast" id="toast" aria-live="polite"></span></div>
   <textarea id="copybox" readonly hidden style="width:100%;margin-top:10px;min-height:8em;font:inherit;background:var(--tray);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:8px"></textarea></div>`;
  G.result=r;
}
function summaryText(){const r=G.result;return `晚上十點下課｜${G.line.role}｜${r.title}\n${r.big.map(([v,l])=>`${l} ${v}`).join("　")}\n${Object.keys(G.s).map(k=>`${G.line.stats[k][0]} ${G.s[k]}`).join("　")}\n`+G.log.map(([a,b])=>`${a} ${b}`).join("\n");}

/* ---------- 輸入 ---------- */
document.addEventListener("click",e=>{
  const term=e.target.closest("[data-term]");if(term){const t=term.dataset.term;const prev=$("sheet").hidden?null:$("sheet").innerHTML;
    $("termPop").hidden=false;$("termPop").innerHTML=`<div class="in"><div class="shead"><span>${esc(t)}</span><button class="close" data-act="closeTerm">關閉</button></div><p>${esc(TERMS[t]||"")}</p></div>`;return;}
  const tab=e.target.closest("[data-tab]");if(tab){codexTab=tab.dataset.tab;window.__codexDraw&&window.__codexDraw();return;}
  const role=e.target.closest("[data-role]");if(role){pickedLine=role.dataset.role;store.set("line",pickedLine);showTitle();return;}
  const ch=e.target.closest("[data-choice]");if(ch&&D){dChoose(+ch.dataset.choice);return;}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="start"){$("cover").hidden=true;startAmbient();newGame(pickedLine);}
  else if(act==="chapterGo")closeChapter();
  else if(act==="epilogue")epilogue();
  else if(act==="resume")resumeGame();
  else if(act==="dnext")dNext();else if(act==="dskip")dSkip();
  else if(act==="closeSheet")closeSheet();else if(act==="closeTerm")$("termPop").hidden=true;
  else if(act==="guide"){const t=targetOf(step().target);path=findPath(t.x,t.z);guiding=true;}
  else if(act==="codex")openCodex();
  else if(act==="sound"){soundOn=!soundOn;store.set("sound",soundOn);renderHud();if(soundOn){beep("ok");startAmbient();}else stopAmbient();}
  else if(act==="home"){showTitle();}
  else if(act==="title")showTitle();
  else if(act==="about")openSheet("關於",`<h3>晚上十點下課</h3><p>一個補習班晚上的小遊戲。靈感來自晶圓廠的打工遊戲 fab24hr，把場景換成台灣的補習班。</p><p>可以玩三個不同的位子：數學老師、櫃台班導、補習班主任。同一個晚上，看到的事情不一樣。</p><p class="hint">補習班、人物、數字都是虛構的，不代表任何一家補習班。</p>`);
  else if(act==="copy"){const txt=summaryText(),t=$("toast");const fb=()=>{const b=$("copybox");b.hidden=false;b.value=txt;b.select();t.textContent="無法自動複製，已幫你選取文字";};
    try{navigator.clipboard.writeText(txt).then(()=>t.textContent="已複製",fb);}catch(err){fb();}}
});
$("sheetBg").addEventListener("click",()=>{if(mode!=="mini")closeSheet();});
$("actBtn").addEventListener("click",interact);
document.addEventListener("contextmenu",e=>{if(!e.target.closest("input,textarea"))e.preventDefault();});
document.addEventListener("selectstart",e=>{if(!e.target.closest||!e.target.closest("input,textarea"))e.preventDefault();});
const KEYMAP={ArrowUp:"u",KeyW:"u",ArrowDown:"d",KeyS:"d",ArrowLeft:"l",KeyA:"l",ArrowRight:"r",KeyD:"r"};
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("input,textarea"))return;
  if(e.key==="Escape"){if(!$("termPop").hidden)$("termPop").hidden=true;else if(!$("sheet").hidden&&mode!=="mini")closeSheet();return;}
  if(KEYMAP[e.code]&&mode==="walk"){keys[KEYMAP[e.code]]=1;path=null;guiding=false;e.preventDefault();return;}
  if(e.code==="KeyE"&&mode==="walk"){e.preventDefault();interact();}
  if(mode==="dialog"&&D&&/^Digit[1-9]$/.test(e.code)){const i=+e.code.slice(5)-1;if(D.choices&&D.i===D.pages.length-1&&D.choices[i])dChoose(i);}
});
document.addEventListener("keyup",e=>{if(KEYMAP[e.code])keys[KEYMAP[e.code]]=0;});
document.querySelectorAll("#dpad button").forEach(b=>{const k=b.dataset.k;
  const on=e=>{e.preventDefault();keys[k]=1;path=null;guiding=false;},off=()=>{keys[k]=0;};
  b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointerleave",off);b.addEventListener("pointercancel",off);});
let downAt=null;const ray=new THREE.Raycaster();
stage.addEventListener("pointerdown",e=>{downAt=[e.clientX,e.clientY];});
stage.addEventListener("pointerup",e=>{if(!downAt||mode!=="walk")return;if(Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>10)return;
  const r=renderer.domElement.getBoundingClientRect();ray.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1},camera);
  const hit=ray.intersectObject(ground)[0];if(hit){path=findPath(hit.point.x,hit.point.z);guiding=false;}});

const sideMarks={};let bannerT=null;
function showBanner(title,text){const b=$("banner");b.innerHTML=`<b>${esc(title)}</b>${esc(text)}`;b.style.top=(document.querySelector(".hud").offsetHeight+56)+"px";b.hidden=false;clearTimeout(bannerT);bannerT=setTimeout(()=>b.hidden=true,2800);}
/* ---------- 主迴圈 ---------- */
const camOff=new THREE.Vector3(0,9,7.4),camLook=new THREE.Vector3(4.5,.6,16);let lastNearKey="";
function tick(){
  const dt=Math.min(.05,clockT.getDelta()),t=clockT.elapsedTime;
  if(G&&player){
    if(mode==="walk"){
      let dx=(keys.r?1:0)-(keys.l?1:0),dz=(keys.d?1:0)-(keys.u?1:0);
      if(!dx&&!dz&&path&&path.length){const [px,pz]=path[0],vx=px-player.position.x,vz=pz-player.position.z,dd=Math.hypot(vx,vz);if(dd<.08)path.shift();else{dx=vx/dd;dz=vz/dd;}}
      if(dx||dz){const l=Math.hypot(dx,dz);dx/=l;dz/=l;const ox=player.position.x,oz=player.position.z;stepPlayer(ox+dx*3.4*dt,oz+dz*3.4*dt);
        if(path&&Math.hypot(player.position.x-ox,player.position.z-oz)<.002){G.stuck=(G.stuck||0)+dt;if(G.stuck>.4){G.stuck=0;const end=path[path.length-1];path=findPath(end[0],end[1]);}}else G.stuck=0;player.rotation.y=Math.atan2(dx,dz);G.moving=true;}
      else G.moving=false;
      near=nearest();const key=near?near.type+near.label:"";if(key!==lastNearKey){lastNearKey=key;renderDock();}
      if(guiding&&near&&near.type==="main"&&path&&path.length<=1){path=null;}
      if(guiding&&!(near&&near.type==="main")){G.reg=(G.reg||0)-dt;if(G.reg<=0){G.reg=.6;const tg=targetOf(step().target);const end=path&&path.length?path[path.length-1]:null;
        if(tg&&(!end||Math.hypot(end[0]-tg.x,end[1]-tg.z)>1.2))path=findPath(tg.x,tg.z);}}
    } else if(near){near=null;lastNearKey="";}
    const act=mode==="walk"?activeSides():[];
    for(const id in sideMarks)sideMarks[id].visible=false;
    act.forEach(sd=>{const tg=targetOf(sd.target);if(!tg)return;const mk=sideMarks[sd.id]||(sideMarks[sd.id]=addSideMark());mk.visible=true;mk.position.set(tg.x,tg.h+Math.sin(t*3+1)*.1,tg.z);});
    if(mode==="walk"){const z=zoneAt(player.position.x,player.position.z);if(z&&z[0]!==G.zone){G.zone=z[0];if(!G.zonesSeen)G.zonesSeen={};if(!G.zonesSeen[z[0]]){G.zonesSeen[z[0]]=1;showBanner(z[0],z[5]);}}}
    const m=targetOf(step()?.target);marker.visible=mode==="walk"&&!!m;if(m)marker.position.set(m.x,m.h+Math.sin(t*3)*.12,m.z);
    Object.values(itemMarks).forEach((s,i)=>{s.position.y=.5+Math.sin(t*2.5+i)*.08;});
    tickClock(dt);tickNight(dt);tickRain(dt);moveNPCs(dt);tickCrowd();if(mode!=="title")tickAmbient(dt);tickFX(dt);
    const spk=mode==="dialog"&&D?D.pages[D.i][0]:null,now=performance.now()/1000;
    animPerson(player,dt,t,{walk:mode==="walk"&&G.moving,talk:spk==="me"});tickEmote(player,now);
    for(const id in npcs){const n=npcs[id];if(!n.visible)continue;animPerson(n,dt,t,{walk:n.userData.moving,talk:spk===id,act:npcAct(id,n,t),raise:id==="parent"&&G.line.id==="teacher"&&step()?.id==="ask"&&mode==="walk"});tickEmote(n,now);}
    extras.forEach(e=>{if(!e.p.visible)return;animPerson(e.p,dt,t,{walk:e.p.userData.moving});tickEmote(e.p,now);});
    const want=new THREE.Vector3(player.position.x,0,player.position.z).add(camOff);if(innerWidth<600)want.add(new THREE.Vector3(0,1.4,1.2));
    const k=1-Math.pow(.002,dt);camera.position.lerp(want,k);camLook.lerp(new THREE.Vector3(player.position.x,.6,player.position.z),k);
    if(FX.shake>0){const a=.18*Math.min(1,FX.shake);camera.position.x+=(Math.random()-.5)*a;camera.position.y+=(Math.random()-.5)*a;}
  } else {camera.position.set(14+Math.sin(t*.1)*6,16,22);camLook.set(14,0,9);const now=performance.now()/1000;moveNPCs(dt);
    extras.forEach(e=>{if(e.p.visible){animPerson(e.p,dt,t,{});tickEmote(e.p,now);}});for(const id in npcs)if(npcs[id].visible)animPerson(npcs[id],dt,t,{act:npcAct(id,npcs[id],t)});}
  camera.lookAt(camLook);renderer.render(scene,camera);requestAnimationFrame(tick);
}

/* ================= 啟動 ================= */
try{buildWorld();buildNight();const L=LINES.teacher;for(const id in L.npcs)if(CHARS[id]&&CHARS[id].body!==undefined)setNPC(id,typeof L.npcs[id]==="function"?null:L.npcs[id],true);showTitle();tick();}
catch(err){const c=$("cover");c.hidden=false;c.innerHTML=`<div class="card"><h2>3D 場景載入失敗</h2><p>你的瀏覽器可能不支援 WebGL，或 3D 函式庫沒有載入。請換一個瀏覽器，或重新整理頁面再試一次。</p></div>`;console.error(err);}

})();
</script>
