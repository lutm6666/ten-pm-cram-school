<style>
/* 版面概念：入夜的補習班樓層是底；上方是教室時鐘，下一步像便利貼貼在上緣，對話、說明、小遊戲都從下方像講義一樣滑出。 */
:root{
  --board:#e7e9e3;--surface:#ffffff;--ink:#1c2633;--muted:#5f6b78;--rule:#d3d8cf;
  --cta:#c9302a;--blue:#1d4fc4;--red:#c9302a;--green:#1f7a4a;--amber:#b7791f;--tray:#eef0ea;
  --glass:rgba(246,247,243,.93);--scrim:rgba(14,18,24,.55);
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --board:#151a20;--surface:#1c222a;--ink:#e6e9e3;--muted:#9aa5b0;--rule:#2f3741;
  --cta:#d63b31;--blue:#86a6ff;--red:#ff8577;--green:#6fd39a;--amber:#f0b45a;--tray:#232b34;
  --glass:rgba(23,28,35,.93);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --board:#151a20;--surface:#1c222a;--ink:#e6e9e3;--muted:#9aa5b0;--rule:#2f3741;
  --cta:#d63b31;--blue:#86a6ff;--red:#ff8577;--green:#6fd39a;--amber:#f0b45a;--tray:#232b34;
  --glass:rgba(23,28,35,.93);--scrim:rgba(0,0,0,.6);color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--board);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.7;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{touch-action:manipulation}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block}
.in{max-width:680px;margin:0 auto}

/* 上方時鐘列 */
.hud{position:fixed;left:0;right:0;top:0;z-index:6;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--glass);border-bottom:1px solid var(--rule);backdrop-filter:blur(6px)}
.bar-row{display:flex;align-items:center;gap:10px}
.clockbox{min-width:0}
.clock{font-family:var(--mono);font-weight:700;font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.05}
.clocksub{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:.8rem;padding:3px 8px;border:1px solid var(--rule);border-radius:3px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.pill.ok i{background:var(--green)}.pill.bad i{background:var(--red)}
.hbtn{background:none;border:none;border-left:1px solid var(--rule);padding:4px 10px;font-size:.88rem;white-space:nowrap}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.meter{min-width:0}
.meter .lab{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted)}
.meter .lab b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.track{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:1px}
.fill{height:100%;background:var(--blue);transition:width .5s}
.meter.low .fill{background:var(--red)}.meter.low .lab b{color:var(--red)}

/* 下一步 */
.next{position:fixed;left:0;right:0;z-index:5;pointer-events:none;padding:0 16px}
.next .in{display:flex;justify-content:center}
.nextcard{pointer-events:auto;display:flex;align-items:center;gap:10px;max-width:100%;background:var(--glass);border:1px solid var(--rule);border-radius:6px;padding:6px 6px 6px 8px;box-shadow:0 4px 18px rgba(0,0,0,.12);backdrop-filter:blur(6px)}
.tag{font-size:.8rem;font-weight:700;background:var(--amber);color:#1c1408;padding:2px 6px;border-radius:3px;white-space:nowrap}
.nextcard .g{font-size:.98rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nextcard button{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:4px 10px;font-size:.85rem;white-space:nowrap}

/* 下方：方向鍵與動作鈕 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px))}
.dock .in{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.dpad{pointer-events:auto;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px}
.dpad button{background:var(--glass);border:1px solid var(--rule);border-radius:6px;font-size:1rem;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.keys{font-size:.74rem;color:var(--muted);background:var(--glass);padding:4px 8px;border-radius:4px}
.act{pointer-events:auto;background:var(--cta);color:#fff;border:none;border-radius:6px;padding:14px 20px;font-weight:700;font-size:1rem;box-shadow:0 6px 18px rgba(201,48,42,.35)}
.act.info{background:var(--ink);color:var(--board);box-shadow:none}

/* 對話框 */
.dlg{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.box{max-width:620px;margin:0 auto;background:var(--surface);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 36px rgba(0,0,0,.22);padding:14px 16px;max-height:min(68vh,560px);overflow:auto}
.spk{display:flex;align-items:center;gap:10px}
.face{width:38px;height:38px;border-radius:5px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;flex:none;font-size:1rem}
.face.sys{background:var(--tray);color:var(--ink);border:1px solid var(--rule)}
.spk b{display:block;font-family:var(--display);font-size:1.08rem;line-height:1.2}
.spk small{display:block;font-size:.74rem;color:var(--muted)}
.say{margin:10px 0 0;font-size:1.02rem}
.say.narr{border-left:3px solid var(--rule);padding-left:10px}
.term{background:none;border:none;padding:0;border-bottom:1.5px dotted var(--amber);font-weight:500}
.tip{margin-top:10px;font-size:.76rem;color:var(--muted);border:1px solid var(--amber);border-radius:3px;padding:3px 8px}
.foot{margin-top:12px;display:flex;align-items:center;gap:8px}
.pg{font-family:var(--mono);font-size:.74rem;color:var(--muted);flex:1}
.go{background:var(--cta);color:#fff;border:none;border-radius:4px;padding:9px 18px;font-weight:700}
.skip{background:none;border:1px solid var(--rule);border-radius:4px;padding:8px 12px}
.choices{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;background:var(--tray);border:1px solid var(--rule);border-radius:4px;padding:11px 13px;line-height:1.45}
.choice:hover{border-color:var(--ink)}
.choice small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.deltas{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.d{font-family:var(--mono);font-size:.74rem;padding:1px 7px;border-radius:3px;border:1px solid currentColor}
.d.up{color:var(--green)}.d.down{color:var(--red)}

/* 說明／小遊戲面板 */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:22;background:var(--surface);border-top:1px solid var(--rule);border-radius:10px 10px 0 0;max-height:82%;overflow:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet-bg{position:fixed;inset:0;z-index:21;background:var(--scrim)}
.shead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:10px}
.shead span{font-size:.85rem;font-weight:700}
.close{background:var(--tray);border:1px solid var(--rule);border-radius:4px;padding:3px 10px;font-size:.82rem}
.zone{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--muted)}
.sheet h3{font-family:var(--display);font-size:1.4rem;margin:2px 0 6px}
.sheet p{margin:0 0 8px}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:6px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:.76rem;border-bottom:1px solid var(--rule);padding:4px 6px 4px 0}
.tbl td{border-bottom:1px solid var(--rule);padding:7px 6px 7px 0;vertical-align:top}
.tbl td small{display:block;color:var(--muted);font-size:.74rem}
.lamp{white-space:nowrap}
.lamp i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.lamp.r i{background:var(--red)}.lamp.y i{background:var(--amber)}.lamp.g i{background:var(--green)}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid var(--rule);border-radius:999px;padding:3px 12px;font-size:.85rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--board);border-color:var(--ink)}
dl.list{margin:0}
dl.list dt{font-family:var(--display);font-weight:700;margin-top:10px}
dl.list dd{margin:0;color:var(--muted);font-size:.9rem}

/* 卡紙小遊戲 */
.jam{margin:10px 0 6px;background:var(--tray);border:1px solid var(--rule);border-radius:8px;padding:16px 10px}
.jam-path{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:center}
.jam-cap{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-top:8px}
.slot{aspect-ratio:3/4;max-width:100%;border-radius:4px;border:1px dashed var(--rule);display:grid;place-items:center;position:relative}
.sheetp{width:100%;height:100%;border-radius:3px;background:var(--surface);border:1px solid var(--muted);box-shadow:2px 2px 0 rgba(0,0,0,.08);font-size:.7rem;color:var(--muted);display:grid;place-items:center;transition:transform .25s,opacity .25s}
.sheetp.crumple{background:repeating-linear-gradient(135deg,var(--surface) 0 6px,var(--tray) 6px 9px)}
.sheetp.gone{opacity:0;transform:translateX(30px) rotate(8deg)}
.sheetp.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.roller{position:absolute;bottom:-9px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--muted)}
.feed{min-height:1.7em;font-size:.92rem}

/* 批考卷小遊戲 */
.paper{margin:10px 0;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;font-family:var(--display);font-size:1.05rem}
.paper .q{font-family:var(--body);font-size:.88rem;color:var(--muted);margin-bottom:6px}
.stepl{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px dashed var(--rule);padding:8px 4px;font-family:var(--mono);font-size:.92rem}
.stepl.hit{background:color-mix(in srgb,var(--red) 14%,transparent);text-decoration:line-through;text-decoration-color:var(--red)}
.stepl.miss{opacity:.5}

/* 全螢幕卡片 */
.cover{position:fixed;inset:0;z-index:20;background:var(--scrim);overflow:auto;padding-inline:16px;padding-block:calc(24px + env(safe-area-inset-top,0px)) 24px;display:grid;place-items:center}
.card{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:22px 20px}
.ticker{font-family:var(--mono);font-size:.78rem;background:var(--ink);color:var(--board);padding:7px 10px;border-radius:4px;display:flex;gap:12px;flex-wrap:wrap}
.ticker .r{color:var(--red)}
.card h1{font-family:var(--display);font-size:clamp(2.2rem,9vw,3rem);line-height:1.1;margin:14px 0 2px;text-wrap:balance}
.card h1 em{font-style:normal;color:var(--red)}
.card .lede{font-weight:700;letter-spacing:.12em;color:var(--muted);margin:0}
.lbl{font-size:.74rem;letter-spacing:.12em;color:var(--muted);margin:16px 0 6px}
.cast{display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.cast div{display:flex;gap:8px;align-items:baseline}
.cast i{width:10px;height:10px;border-radius:2px;flex:none;transform:translateY(1px)}
.cast b{font-family:var(--display)}
.cast span{color:var(--muted)}
.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.role{text-align:left;background:var(--tray);border:1px solid var(--rule);border-radius:6px;padding:10px;min-width:0}
.role b{display:block;font-family:var(--display);font-size:1.05rem}
.role small{display:block;color:var(--muted);font-size:.76rem;line-height:1.4}
.role[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.role[disabled]{opacity:.5;cursor:not-allowed}
.big-go{display:block;width:100%;margin-top:16px;background:var(--cta);color:#fff;border:none;border-radius:6px;padding:14px;font-size:1.15rem;font-weight:700;font-family:var(--display);letter-spacing:.3em}
.hint{font-size:.8rem;color:var(--muted);margin-top:10px}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.links button{background:none;border:none;padding:0;text-decoration:underline;font-size:.9rem}

.chap{text-align:center;color:#fff;max-width:420px}
.chap .t{font-family:var(--mono);color:#f0b45a;font-size:.95rem}
.chap h2{font-family:var(--display);font-size:2.2rem;margin:4px 0}
.chap p{opacity:.85;margin:0 0 16px}
.chap .rush{text-align:left;margin:0 0 16px;display:flex;flex-direction:column;gap:6px}
.chap .rush div{border-left:3px solid #f0b45a;padding-left:10px}
.chap .rush div:first-child{border-color:#ff8577}
.chap button{background:none;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:4px;padding:8px 20px}
.cover.dark{background:rgba(8,10,14,.82)}

.report h2{font-family:var(--display);font-size:1.9rem;margin:6px 0 4px}
.kick{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;color:var(--muted)}
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.big div{border-top:2px solid var(--ink);padding-top:6px;min-width:0}
.big b{font-family:var(--mono);font-size:1.6rem;display:block;line-height:1.2}
.big span{font-size:.78rem;color:var(--muted)}
.log{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.log li{display:grid;grid-template-columns:3.4em 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule);font-size:.86rem}
.log li span{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.primary{background:var(--ink);color:var(--board);border:none;border-radius:4px;padding:10px 16px;font-weight:500}
.ghost{background:none;border:1px solid var(--rule);border-radius:4px;padding:9px 14px}
.toast{font-size:.85rem;color:var(--green)}
.banner{position:fixed;left:50%;transform:translateX(-50%);z-index:7;background:var(--glass);border:1px solid var(--rule);border-left:4px solid var(--green);border-radius:4px;padding:6px 12px;font-size:.86rem;max-width:calc(100% - 32px);backdrop-filter:blur(6px)}
.banner b{display:block;font-family:var(--display)}
.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,.sheetp.shake{animation:none}.sheetp{transition:none}}
@media (max-width:440px){.meters{grid-template-columns:repeat(2,1fr);gap:2px 14px}.clock{font-size:1.25rem}.hbtn{padding:4px 7px}.roles{grid-template-columns:1fr}}

.due{color:var(--muted)}.due.warn{color:var(--amber);font-weight:700}.due.late{color:var(--red);font-weight:700}

/* 畫面外目標的方向箭頭 */
.edge{position:fixed;z-index:5;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid #f0b45a;background:rgba(28,20,8,.78);color:#f0b45a;display:grid;place-items:center;font-size:.95rem;font-weight:900;padding:0;box-shadow:0 0 0 3px rgba(240,180,90,.25);animation:edgep 1.2s ease-in-out infinite}
.edge span{display:block;transition:transform .1s linear}
@keyframes edgep{50%{box-shadow:0 0 0 7px rgba(240,180,90,0)}}
/* 手機訊息 */
.msg{position:fixed;left:16px;z-index:6;max-width:min(320px,calc(100% - 32px));background:var(--glass);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:4px;padding:6px 12px;backdrop-filter:blur(6px);box-shadow:0 4px 16px rgba(0,0,0,.15);animation:fade .3s ease}
.msg small{display:block;font-size:.72rem;color:var(--muted)}
.msg div{font-size:.92rem}
.nexthint{pointer-events:none;font-size:.8rem;line-height:1.5;color:var(--ink);text-align:center;margin:6px auto 0;padding:6px 10px;max-width:30em;background:var(--glass);border:1px solid var(--rule);border-radius:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
@media (prefers-reduced-motion:reduce){.edge{animation:none}}

.camreset{pointer-events:auto;align-self:flex-end;width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:var(--glass);font-size:1.2rem;margin-left:auto;margin-right:8px}

.act{white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis}
.act.chat{padding:12px 14px;font-size:.92rem;background:var(--surface);color:var(--ink);border:2px solid var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.clocksub .ot{display:inline-block;background:#7c2d12;color:#fff;border-radius:3px;padding:0 5px;margin-right:4px;font-weight:700}
.lock{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.lk{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;justify-content:center;border:1px solid var(--rule);border-radius:6px;font-size:.8rem;padding:6px 4px;text-align:center;background:var(--tray);color:var(--muted)}
.lk span{font-size:1.3rem;filter:grayscale(1);opacity:.5}
.lk.on{background:#fff6d6;color:var(--ink);border-color:#e0b100;box-shadow:0 0 0 2px rgba(224,177,0,.25),0 0 14px rgba(255,200,0,.35)}
.lk.on span{filter:none;opacity:1}

    const ph=crowdPhase,vis=extras.filter(e=>e.p.visible&&!e.p.userData.path&&!e.p.userData.actUntil);

        else{u.act="stretch";u.actUntil=now+1.6;}}

      const wanted=step()?.target?.npc===id||(typeof activeSides==='function'&&activeSides().some(sd=>sd.target?.npc===id));

function npcAct(id,n,t){
  if(n.userData.act==='cover')return 'cover';
  const u=n.userData;if(u.moving)return null;const x=n.position.x,z=n.position.z,ph=crowdPhase;
  if(id==="yun"&&Math.hypot(x-3.75,z-10.3)<1)return (t%12)<7?"type":"phone";
  if(id==="teacher"){if(ph==="class"&&Math.hypot(x-20,z-1.2)<1.2)return "board";if(x<9&&z>5&&z<9)return "cup";}
  if(id==="boss"&&x<9&&z<5)return (t%16)<5?"phone":null;
  if(id==="zhe"){if(u.seated&&ph==="class")return "sleep";if(ph==="break"||ph==="pre")return "game";}
  if(id==="bo"&&u.seated)return "game";
  if(CHARS[id]&&CHARS[id].kid&&u.seated)return ph==="class"?"type":null;
  if(id==="deliv")return "wave";
  if(id==="hong"&&!u.moving&&(t%9)<3)return "board";
  return null;
}

/* 環境音：冷氣低鳴、鐘聲、雨聲、電話鈴 */
let amb=null,MUSIC_DAY=false;
function ensureAudio(){if(!soundOn)return null;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){return null;}return actx;}
function noiseBuf(a,sec){const b=a.createBuffer(1,a.sampleRate*sec,a.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5;}return b;}
let master=null;
function out(){const a=actx;if(!master){master=a.createGain();master.gain.value=1;master.connect(a.destination);}return master;}
function startAmbient(){const a=ensureAudio();if(!a||amb)return;const o=out();
  const src=a.createBufferSource();src.buffer=noiseBuf(a,4);src.loop=true;const f=a.createBiquadFilter();f.type="lowpass";f.frequency.value=420;const g=a.createGain();g.gain.value=.16;
  const hum=a.createOscillator();hum.frequency.value=60;const hg=a.createGain();hg.gain.value=.02;hum.connect(hg);hg.connect(bus("amb"));hum.start();
  src.connect(f);f.connect(g);g.connect(bus("amb"));src.start();
  /* 背景音樂：溫和的和弦循環 */
  const mg=a.createGain();mg.gain.value=.0001;mg.gain.exponentialRampToValueAtTime(.11,a.currentTime+3);mg.connect(bus("music"));
  const NIGHT_CH=[[261.6,329.6,392,493.9],[220,261.6,329.6,392],[174.6,220,261.6,329.6],[196,246.9,293.7,349.2]],DAY_CH=[[293.7,370,440,587.3],[329.6,415.3,493.9,659.3],[246.9,293.7,370,493.9],[220,277.2,329.6,440]];
  let i=0,t0=a.currentTime+.2;const bar=3.2;
  const sched=()=>{if(!amb)return;while(t0<a.currentTime+bar*2){const chords=MUSIC_DAY?DAY_CH:NIGHT_CH;const ch=chords[i++%chords.length];
      ch.forEach((fq,k)=>{const os=a.createOscillator(),gg=a.createGain();os.type=k?"sine":"triangle";os.frequency.value=fq*(k?1:.5);gg.gain.setValueAtTime(.0001,t0);gg.gain.exponentialRampToValueAtTime(k?.18:.25,t0+.6);gg.gain.exponentialRampToValueAtTime(.0001,t0+bar+.4);os.connect(gg);gg.connect(mg);os.start(t0);os.stop(t0+bar+.5);});
      [0,1,2,3].forEach(n=>{const fq=ch[(n*2+i)%4]*2,tt=t0+n*bar/4+.1,os=a.createOscillator(),gg=a.createGain();os.type="sine";os.frequency.value=fq;gg.gain.setValueAtTime(.0001,tt);gg.gain.exponentialRampToValueAtTime(.07,tt+.02);gg.gain.exponentialRampToValueAtTime(.0001,tt+.7);os.connect(gg);gg.connect(mg);os.start(tt);os.stop(tt+.8);});
      t0+=bar;}};
  sched();const iv=setInterval(sched,1000);
  amb={src,g,hum,hg,mg,iv};}
function stopAmbient(){if(!amb)return;try{amb.src.stop();amb.hum.stop();clearInterval(amb.iv);amb.mg.disconnect();}catch(e){}amb=null;}
function chime(){const a=ensureAudio();if(!a)return;const notes=MUSIC_DAY?[784,659,784,659,880,784]:[659,523,587,392,392,587,659,523];let t0=a.currentTime+.05;
  notes.forEach(fq=>{const o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=fq;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.2,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.9);o.connect(g);g.connect(bus("sfx"));o.start(t0);o.stop(t0+1);t0+=.42;});}
function rainSound(sec=8){const a=ensureAudio();if(!a)return;const s=a.createBufferSource();const b=a.createBuffer(1,a.sampleRate*2,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;s.buffer=b;s.loop=true;
  const f=a.createBiquadFilter();f.type="highpass";f.frequency.value=1200;const g=a.createGain();g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.16,a.currentTime+1);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+sec);
  s.connect(f);f.connect(g);g.connect(bus("amb"));s.start();s.stop(a.currentTime+sec+.2);}
function ring(times=2){const a=ensureAudio();if(!a)return;let t0=a.currentTime+.05;for(let k=0;k<times;k++){for(let j=0;j<8;j++){const o=a.createOscillator(),g=a.createGain();o.frequency.value=j%2?440:480;g.gain.setValueAtTime(.12,t0);g.gain.setValueAtTime(0,t0+.05);o.connect(g);g.connect(bus("sfx"));o.start(t0);o.stop(t0+.05);t0+=.05;}t0+=.6;}}
/* 白天：偶爾有鳥叫、遠處的機車 */
function chirp(){const a=ensureAudio();if(!a||!amb)return;let t0=a.currentTime+.02;const n=2+Math.floor(Math.random()*3),base=2400+Math.random()*900;
  for(let k=0;k<n;k++){const o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.setValueAtTime(base,t0);o.frequency.exponentialRampToValueAtTime(base*1.35,t0+.07);
    g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.05,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+.09);o.connect(g);g.connect(bus("amb"));o.start(t0);o.stop(t0+.1);t0+=.13;}}

   原則：不靠全螢幕濾鏡改觀感。保留原版清楚的色調，只增加真正的 3D 物件、材質分層與角色辨識度。 */

/* ---------- 小型美術工具 ---------- */
const ART_MATERIAL_CACHE=new Map();
function artMat(color,rough=.78,metal=.02){
  const key=`${color}|${rough}|${metal}`;
  if(ART_MATERIAL_CACHE.has(key))return ART_MATERIAL_CACHE.get(key);
  const m=new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
  ART_MATERIAL_CACHE.set(key,m);return m;
}
function artBox(w,h,d,color,x,y,z,parent,rough=.78,metal=.02){
  const m=new THREE.Mesh(bgeo(w,h,d),artMat(color,rough,metal));
  m.position.set(x,y,z);(parent||scene).add(m);return m;
}
function artCyl(rt,rb,h,color,x,y,z,parent,segments=16){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segments),artMat(color));
  m.position.set(x,y,z);(parent||scene).add(m);return m;
}
function artPaper(w,d,x,y,z,color=0xf7f3e8,ry=0){
  const p=artBox(w,.018,d,color,x,y,z,null,.92,0);p.rotation.y=ry;return p;
}
function artBook(w,d,x,y,z,color,ry=0){
  const b=artBox(w,.055,d,color,x,y,z,null,.82,0);b.rotation.y=ry;
  artBox(w*.93,.008,d*.92,0xf5f0e5,x,y+.032,z,null,.95,0).rotation.y=ry;return b;

function artCup(x,y,z,color=0xf4f4f0){

function fmChamferGeo(w,h,d,r=.06){
  r=Math.min(r,w*.24,d*.24);const x=w/2,z=d/2,y=h/2;

  const tri=(a,b,c)=>{add(a);add(b);add(c);};
  for(let i=1;i<7;i++){
    tri([p[0][0],-y,p[0][1]],[p[i][0],-y,p[i][1]],[p[i+1][0],-y,p[i+1][1]]);
    tri([p[0][0],y,p[0][1]],[p[i+1][0],y,p[i+1][1]],[p[i][0],y,p[i][1]]);
  }
  for(let i=0;i<8;i++){
    const j=(i+1)%8,a=p[i],b=p[j];
    tri([a[0],-y,a[1]],[b[0],y,b[1]],[b[0],-y,b[1]]);
    tri([a[0],-y,a[1]],[a[0],y,a[1]],[b[0],y,b[1]]);

  const geo=new THREE.BufferGeometry();

/* fmChamferGeo 原本只有頂/底面的 UV 有面積；側面上下頂點共用同一組 x/z UV，
   會讓側面木紋/烤漆貼圖塌成一條線。改成頂/底用平面 UV、側面沿周長展開。
   側面 U 依真實邊長比例累積，因此長邊、倒角與短邊不會各自被硬拉成一整張貼圖。
   Phase 2 有大量同尺寸桌腳、椅架與板件，因此再以尺寸+r 做 BufferGeometry 快取。 */
const FM_CHAMFER_CACHE=new Map();
fmChamferGeo=function(w,h,d,r=.06){
  r=Math.min(r,w*.24,d*.24);
  const key=[w,h,d,r].map(v=>Number(v).toFixed(4)).join('|');
  if(FM_CHAMFER_CACHE.has(key))return FM_CHAMFER_CACHE.get(key);
  const x=w/2,z=d/2,y=h/2;
  const p=[[-x+r,-z],[x-r,-z],[x,-z+r],[x,z-r],[x-r,z],[-x+r,z],[-x,z-r],[-x,-z+r]];
  const verts=[],uvs=[];
  const add=(v,uv)=>{verts.push(...v);uvs.push(...uv);};
  const tri=(a,b,c,ua,ub,uc)=>{add(a,ua);add(b,ub);add(c,uc);};
  const faceUV=v=>[v[0]/w+.5,v[2]/d+.5];
  for(let i=1;i<7;i++){
    const b0=[p[0][0],-y,p[0][1]],b1=[p[i][0],-y,p[i][1]],b2=[p[i+1][0],-y,p[i+1][1]];
    const t0=[p[0][0],y,p[0][1]],t1=[p[i+1][0],y,p[i+1][1]],t2=[p[i][0],y,p[i][1]];
    tri(b0,b1,b2,faceUV(b0),faceUV(b1),faceUV(b2));
    tri(t0,t1,t2,faceUV(t0),faceUV(t1),faceUV(t2));
  }
  const edgeLen=p.map((a,i)=>{const b=p[(i+1)%8];return Math.hypot(b[0]-a[0],b[1]-a[1]);});
  const perimeter=edgeLen.reduce((a,b)=>a+b,0);let run=0;
  for(let i=0;i<8;i++){
    const j=(i+1)%8,a=p[i],b=p[j],u0=run/perimeter,u1=(run+edgeLen[i])/perimeter;run+=edgeLen[i];
    const a0=[a[0],-y,a[1]],b0=[b[0],-y,b[1]],b1=[b[0],y,b[1]],a1=[a[0],y,a[1]];
    tri(a0,b1,b0,[u0,0],[u1,1],[u1,0]);
    tri(a0,a1,b1,[u0,0],[u0,1],[u1,1]);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  geo.computeVertexNormals();FM_CHAMFER_CACHE.set(key,geo);return geo;
};

/* 同一張程序貼圖可以共用 Canvas，但不同尺寸家具不能共用同一組 repeat。
   clone() 只複製 Texture 狀態、仍共用原 image，避免為每張桌子再建立 512px Canvas。
   測試 stub 比真實 Three.js 精簡，center/rotation 若不存在就略過，不影響遊戲本體。 */
function fmTextureView(key,base,rx,ry,rotation=0){
  const k='view:'+key;if(FM.textures[k])return FM.textures[k];
  const t=base.clone?base.clone():base;t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(t.repeat&&t.repeat.set)t.repeat.set(rx,ry);
  if(t.center&&t.center.set)t.center.set(.5,.5);
  if('rotation' in t)t.rotation=rotation;
  t.needsUpdate=true;
  FM.textures[k]=t;return t;
}

function p2EnvTex(key,base,line,grain,rx=4,ry=4){
  return fmCanvasTex('p2env:'+key,512,512,(g,w,h)=>{
    g.fillStyle=base;g.fillRect(0,0,w,h);
    const rnd=fmRand(p2Hash(key));
    for(let i=0;i<1300;i++){
      const a=.018+rnd()*.035,s=.5+rnd()*1.3;
      g.fillStyle=`rgba(${grain[0]},${grain[1]},${grain[2]},${a})`;
      g.fillRect(rnd()*w,rnd()*h,s,s);
    }
    if(line){
      g.strokeStyle=line;g.lineWidth=1;
      for(let x=0;x<=w;x+=128){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();}
      for(let y=0;y<=h;y+=128){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}
    }
  },rx,ry);
}

      for(let x=0;x<=w;x+=8){const yy=y+Math.sin(x*.03+phase)*(1+rnd()*3);x?g.lineTo(x,yy):g.moveTo(x,yy);}

/* ================= Phase 2：名牌與任務標記整理 =================
   目標：多人同框時減少頭頂 UI 疊在一起。
   玩家 / 主線 / 支線優先；遠處一般 NPC 名牌自動退場。
   只改顯示邏輯，不碰事件、尋路或任務判定。 */

const P2_UI_PROJ=new THREE.Vector3();
let P2_UI_NEXT=0;

function p2UiRememberScale(o){
  if(!o||!o.scale)return null;
  o.userData=o.userData||{};
  if(!o.userData.p2BaseScale)o.userData.p2BaseScale=[o.scale.x,o.scale.y,o.scale.z];
  return o.userData.p2BaseScale;
}
function p2UiScale(o,f){
  const b=p2UiRememberScale(o);if(!b)return;
  o.scale.set(b[0]*f,b[1]*f,b[2]*f);
}
function p2UiProject(actor,label){
  if(!actor||!label||!camera)return null;
  P2_UI_PROJ.set(actor.position.x,actor.position.y+(label.position?.y||1.45),actor.position.z).project(camera);
  if(P2_UI_PROJ.z<-1||P2_UI_PROJ.z>1||Math.abs(P2_UI_PROJ.x)>1.16||Math.abs(P2_UI_PROJ.y)>1.16)return null;
  return {x:(P2_UI_PROJ.x+1)*.5*innerWidth,y:(1-P2_UI_PROJ.y)*.5*innerHeight};
}
function p2UiRectsTouch(a,b,margin){
  return !(a.r+margin<b.l||b.r+margin<a.l||a.b+margin<b.t||b.b+margin<a.t);
}
function p2UiLabelEntry(actor,id,priority,dist){
  const label=actor&&actor.userData&&actor.userData.label;if(!label)return null;
  const p=p2UiProject(actor,label);if(!p)return {actor,label,id,priority,dist,off:true};
  const base=p2UiRememberScale(label)||[1,1,1];
  const w=Math.max(72,Math.min(168,70+base[0]*58)),h=innerWidth<600?32:28;
  return {actor,label,id,priority,dist,p,rect:{l:p.x-w/2,r:p.x+w/2,t:p.y-h/2,b:p.y+h/2}};
}
function p2UiResolvedTarget(t){return typeof t==='function'?t(G):t;}
function p2UiTuneLabels(){
  if(!G||!player||!camera||mode!=="walk")return;
  const mobile=innerWidth<600,maxDist=mobile?5.4:7.2,maxLabels=mobile?4:7;
  const cur=step&&step(),mainTarget=p2UiResolvedTarget(cur&&cur.target),mainId=mainTarget&&mainTarget.npc||null;
  const sideIds=new Set(),chatIds=new Set();
  try{activeSides().forEach(sd=>{const t=p2UiResolvedTarget(sd.target);if(t&&t.npc)sideIds.add(t.npc);});}catch(e){}
  try{chatTargets().forEach(id=>chatIds.add(id));}catch(e){}
  const pZone=zoneAt(player.position.x,player.position.z),pZoneName=pZone&&pZone[0],entries=[];

  const add=(actor,id,isPlayer=false)=>{
    if(!actor||!actor.visible||!actor.userData||!actor.userData.label)return;
    const d=Math.hypot(actor.position.x-player.position.x,actor.position.z-player.position.z);
    const z=zoneAt(actor.position.x,actor.position.z),same=!!(z&&pZoneName&&z[0]===pZoneName);
    let pri=isPlayer?100:id===mainId?96:sideIds.has(id)?86:chatIds.has(id)?72:d<2.2?66:same?48:24;
    const keep=isPlayer||id===mainId||sideIds.has(id)||d<=maxDist||(same&&d<=maxDist+1.8);
    actor.userData.label.visible=keep;
    if(!keep)return;
    const e=p2UiLabelEntry(actor,id,pri,d);if(e)entries.push(e);
  };
  add(player,"__player",true);for(const id in npcs)add(npcs[id],id,false);

  entries.sort((a,b)=>b.priority-a.priority||a.dist-b.dist);
  const kept=[];let count=0;
  for(const e of entries){
    if(e.off){e.label.visible=false;continue;}
    const overlap=kept.some(k=>p2UiRectsTouch(e.rect,k.rect,mobile?7:5));
    const forced=e.id==="__player"||e.id===mainId;
    const show=(forced||!overlap)&&count<maxLabels;
    e.label.visible=show;
    if(show){
      const f=forced?1:(e.dist<2.8?.96:e.dist<5?.86:.76);
      p2UiScale(e.label,f);kept.push(e);count++;
    }
  }
}
function p2UiTuneMarkers(){
  if(!G||!player||mode!=="walk")return;
  const mobile=innerWidth<600,pZone=zoneAt(player.position.x,player.position.z),pName=pZone&&pZone[0];
  const dist=(x,z)=>Math.hypot(x-player.position.x,z-player.position.z);

  // 主線驚嘆號一直保留，但遠距離略縮小；畫面外仍由 edgeArrow 導航。
  if(marker&&marker.visible){
    const d=dist(marker.position.x,marker.position.z);p2UiScale(marker,d<3?1:d<7?.88:.76);
  }

  // 支線問號只在附近或同區域顯示，避免隔牆整排問號浮在畫面上。
  let active=[];try{active=activeSides();}catch(e){}
  active.forEach(sd=>{
    const mk=sideMarks[sd.id],tg=targetOf(sd.target);if(!mk||!tg)return;
    const d=dist(tg.x,tg.z),z=zoneAt(tg.x,tg.z),same=!!(z&&pName&&z[0]===pName);
    const show=d<(mobile?6.2:8.0)||(same&&d<11.5);
    mk.visible=mk.visible&&show;
    if(mk.visible)p2UiScale(mk,d<3?1:d<6?.86:.72);
  });

  // 資訊點是低優先級，只留同區域 / 近距離的，任務與收集物不受影響。
  for(const id in infoMarks){
    const mk=infoMarks[id];if(!mk)continue;
    const d=dist(mk.position.x,mk.position.z),z=zoneAt(mk.position.x,mk.position.z),same=!!(z&&pName&&z[0]===pName);
    mk.visible=d<(mobile?4.8:6.2)||(same&&d<8.5);
    if(mk.visible)p2UiScale(mk,d<3?.9:.76);
  }
}
function p2UiTick(){
  const now=performance.now();if(now<P2_UI_NEXT)return;P2_UI_NEXT=now+110;
  p2UiTuneLabels();p2UiTuneMarkers();
}

/* tickEdge 每幀本來就會被主迴圈呼叫；在它後面做低頻 UI 排版，不另開 RAF。 */

/* ================= Phase 2：重複幾何快取 + 場景 profiler =================
   目標：降低人物與圓形家具重複建立 BufferGeometry 的成本，並量化 mesh 熱點。
   只共用幾何資料，不改 Mesh、Material、動畫骨架或 transform。 */

const P2_PERF_GEO_CACHE=new Map();
function p2PerfKey(type,args){return type+'|'+args.map(v=>typeof v==='number'?Number(v).toFixed(5):String(v)).join('|');}
function p2PerfCachedCtor(type,Base){
  function Cached(...args){
    const k=p2PerfKey(type,args);
    let g=P2_PERF_GEO_CACHE.get(k);
    if(!g){g=new Base(...args);P2_PERF_GEO_CACHE.set(k,g);}
    return g;
  }
  Cached.prototype=Base.prototype;
  return Cached;
}

/* 這些幾何在目前場景中都只透過 Mesh transform 改形，不直接 mutate geometry。 */
if(THREE.SphereGeometry&&!THREE.SphereGeometry.__p2Cached){
  const Base=THREE.SphereGeometry,C=p2PerfCachedCtor('sphere',Base);C.__p2Cached=true;C.__p2Base=Base;THREE.SphereGeometry=C;
}
if(THREE.CylinderGeometry&&!THREE.CylinderGeometry.__p2Cached){

}

/* 場景 profiler：不改渲染，只盤點 draw-call 候選熱點。
   會在 CI screenshot artifact 留下 teacher / care / jh 三組 JSON。 */
function p2PerfAudit(){
  if(!scene||!scene.traverse)return null;
  const geoCount=new Map(),matCount=new Map();
  let meshes=0,visibleMeshes=0;
  scene.traverse(o=>{
    if(!o||!o.isMesh)return;
    meshes++;if(o.visible!==false)visibleMeshes++;
    if(o.geometry)geoCount.set(o.geometry,(geoCount.get(o.geometry)||0)+1);
    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(m=>{if(m)matCount.set(m,(matCount.get(m)||0)+1);});
  });
  const names=new Map();
  if(typeof FM_CHAMFER_CACHE!=='undefined')for(const [k,g] of FM_CHAMFER_CACHE)names.set(g,'chamfer:'+k);
  for(const [k,g] of P2_PERF_GEO_CACHE)names.set(g,k);
  const top=[...geoCount.entries()].sort((a,b)=>b[1]-a[1]).slice(0,16).map(([g,count])=>({
    count,
    key:names.get(g)||g.type||g.constructor&&g.constructor.name||'geometry',
    vertices:g.attributes&&g.attributes.position&&g.attributes.position.count||null
  }));
  const summary={meshes,visibleMeshes,uniqueGeometries:geoCount.size,uniqueMaterials:matCount.size,cachedRoundGeometries:P2_PERF_GEO_CACHE.size,cachedChamferGeometries:typeof FM_CHAMFER_CACHE!=='undefined'?FM_CHAMFER_CACHE.size:null,topGeometries:top};
  window.__artPerf=summary;
  return summary;
}
window.__p2PerfAudit=p2PerfAudit;

  const pool=OT_EVENTS.filter(e=>e.lines.includes(L.id)&&!(L.day===2&&e.id==="meeting")).sort(()=>Math.random()-.5);
  const n=Math.random()<.5?1:2;
  return pool.slice(0,n).map((e,i)=>({...e.make(L.id),id:"ot_"+e.id,t:OT_TIMES[i],isEvent:true,ot:true}));
}
function otRestore(id,t,L){const e=OT_EVENTS.find(x=>"ot_"+x.id===id);return e?{...e.make(L.id),id,t,isEvent:true,ot:true}:null;}

function matchQ(qs,text){const t=text.replace(/\s/g,"");let best=-1,score=0;
  qs.forEach((q,i)=>{let s=0;q.keys.forEach(k=>{if(t.includes(k))s+=k.length;});if(t&&q.q.replace(/[？?]/g,"").includes(t))s+=t.length;if(s>score){score=s;best=i;}});return best;}

function askChat(i,typed){
  if(!CH||CH.busy)return;const C=CHATS[CH.id],log=$("clog");if(!log)return;
  const q=i>=0?C.qs[i]:null;CH.busy=true;
  log.insertAdjacentHTML("beforeend",`<div class="bub me">${esc(typed||q.q)}</div><div class="bub them typing">想一下…</div>`);log.scrollTop=log.scrollHeight;
  spend(1);beep("blip");
  setTimeout(()=>{if(!CH)return;const tp=log.querySelector(".typing");const ans=q?chatAnswer(q,CH.pk).replace(/\{me\}/g,ME(G)):CHAT_IDK[CH.id];
    if(tp){tp.classList.remove("typing");tp.textContent=ans;}log.scrollTop=log.scrollHeight;CH.busy=false;
    if(q&&q.set)Object.assign(G.f,q.set);
    if(q){const key=CH.id+":"+i;if(!G.chatUsed.includes(key))G.chatUsed.push(key);CH.asked.add(i);const b=document.querySelector(`#cchips [data-q="${i}"]`);if(b)b.classList.add("asked");
      const seen=new Set(store.get("chats",[]));seen.add(key);store.set("chats",[...seen]);}
    renderHud();},520);
}
function endChat(first,ret){const id=CH&&CH.id,after=CH&&CH.after;CH=null;
  let d="";if(first&&id){const fx=(CHAT_FX[id]||{})[G.line.id];if(fx&&Object.keys(fx).length)d=applyFx(fx);}

/* 分教材：每一疊放到對的地方 */
MINIS.sortout={
  head:"影印機旁・分教材",zone:"大廳・影印機",title:"一疊一疊分好",cost:4,
  intro:"五疊東西，各有各的去處。分錯了，晚上就會有人找不到。",
  opts:["國小安親","國中部","高三 B 班","櫃台"],
  items:[["國小二年級 數學習作解答",0],["國中八年級 英文段考複習卷",1],["高三 B 班 空間向量講義",2],["李阿嬤要的收據本",3],["今天的點心登記表",0]],
  mount(el,done){let i=0,ok=0;const self=this;
    function draw(){const it=self.items[i];
      el.innerHTML=`<div class="paper"><div class="q">第 ${i+1} / ${self.items.length} 疊</div><div>${esc(it[0])}</div></div><div class="choices">${self.opts.map((o,k)=>`<button class="choice" data-k="${k}">${esc(o)}</button>`).join("")}</div><p class="feed" aria-live="polite"></p><div class="actions" hidden><button class="go" data-next>下一疊</button></div>`;
      const feed=el.querySelector(".feed"),act=el.querySelector(".actions");
      el.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>{if(!act.hidden)return;const k=+b.dataset.k;
        if(k===it[1]){ok++;feed.textContent="放好了。";}else feed.textContent=`應該是「${self.opts[it[1]]}」的。`;
        el.querySelectorAll("[data-k]").forEach((x,j)=>{x.disabled=true;if(j===it[1])x.style.borderColor="var(--green)";});act.hidden=false;
        act.querySelector("[data-next]").onclick=()=>{if(i<self.items.length-1){i++;draw();}else{el.innerHTML=`<p class="feed">分完了，放對 ${ok} / ${self.items.length} 疊。</p>`;done({ok});}};}));}
    draw();}
};

  mount(el,done){let r=0,score=0;const self=this;

  intro:"先算出這個月要收多少，再從抽屜裡拿零錢找給阿嬤。",
  bill:[["十月安親費",6800],["點心費",600],["教材費",350]],paid:10000,
  mount(el,done){const self=this,total=this.bill.reduce((a,b)=>a+b[1],0),opts=[total,total-600,total+600].sort(()=>Math.random()-.5);let right=false,stage=1;
    el.innerHTML=`<div class="paper"><div class="q">安安・十月</div>${this.bill.map(b=>`<div style="display:flex;justify-content:space-between"><span>${b[0]}</span><b style="font-family:var(--mono)">${b[1].toLocaleString()}</b></div>`).join("")}<div style="margin-top:6px">阿嬤給了 <b style="font-family:var(--mono)">${this.paid.toLocaleString()}</b> 元</div></div>
      <div id="chStage"><div class="lbl">應收多少？</div><div class="choices">${opts.map(v=>`<button class="choice" data-k="${v}">${v.toLocaleString()} 元</button>`).join("")}</div></div><p class="feed" aria-live="polite"></p>`;
    const feed=el.querySelector(".feed"),box=el.querySelector("#chStage");
    box.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>{if(stage!==1)return;stage=2;right=+b.dataset.k===total;
      feed.textContent=right?"對，應收 "+total.toLocaleString()+" 元。":"再算一次……應收是 "+total.toLocaleString()+" 元。";
      let left=self.paid-total;const used=[],den=[1000,500,100,50,10,5,1];
      box.innerHTML=`<div class="lbl">要找 <b id="chLeft" style="font-family:var(--mono)">${left}</b> 元。點抽屜裡的錢。</div><div class="choices" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${den.map(d=>`<button class="choice" data-n="${d}" style="text-align:center">${d>=100?"💵":"🪙"} ${d}</button>`).join("")}</div><div class="lbl">已拿：<span id="chUsed">—</span></div><div class="actions" hidden><button class="go" data-next>開收據</button></div>`;
      const sync=()=>{box.querySelectorAll("[data-n]").forEach(x=>x.disabled=+x.dataset.n>left);box.querySelector("#chLeft").textContent=left;box.querySelector("#chUsed").textContent=used.length?used.join("＋"):"—";box.querySelector(".actions").hidden=left!==0;};
      box.querySelectorAll("[data-n]").forEach(x=>x.addEventListener("click",()=>{const d=+x.dataset.n;if(d>left)return;left-=d;used.push(d);sync();}));
      box.querySelector("[data-next]").addEventListener("click",function(){if(this.disabled)return;this.disabled=true;
        let rem=self.paid-total,opt=0;den.forEach(d=>{while(rem>=d){rem-=d;opt++;}});const exact=used.length<=opt;
        feed.textContent=`找了 ${used.length} 張／個${exact?"，剛剛好。":"。其實可以用更少張。"}收據上寫：安安媽媽。`;done({right,bills:used.length,exact});});
      sync();}));}
};

MINIS.pickup={
  head:"門口・接送",zone:"大門口",title:"交給對的人",cost:6,
  intro:"接送名單：安安｜阿嬤、媽媽　小宇｜媽媽　小米｜媽媽。不在名單上的人來接，先打給家長。",
  opts:["交給他","先打電話給家長確認","請他到旁邊等一下"],
  rounds:[
   {who:"李阿嬤",say:"「老師，我來接安安。」",ok:0},
   {who:"年輕男生",say:"「我是小宇的舅舅，他媽媽叫我來接。」",ok:1},
   {who:"小宇媽媽",say:"「不好意思！他舅舅剛剛打給我，我還是自己來了。」",ok:0},
   {who:"一位阿姨",say:"「我是小米媽媽的同事，她說今天會晚，叫我先來接。」",ok:1,mi:1}
  ],
  mount(el,done){let i=0,ok=0,handedMi=false;const self=this;
    function draw(){const R=self.rounds[i];
      el.innerHTML=`<div class="paper"><div class="q">第 ${i+1} / ${self.rounds.length} 位・${esc(R.who)}</div>${esc(R.say)}</div><div class="choices">${self.opts.map((o,k)=>`<button class="choice" data-k="${k}">${esc(o)}</button>`).join("")}</div><p class="feed" aria-live="polite"></p><div class="actions" hidden><button class="go" data-next>下一位</button></div>`;
      const feed=el.querySelector(".feed"),act=el.querySelector(".actions");
      el.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>{if(!act.hidden)return;const k=+b.dataset.k;
        if(k===R.ok){ok++;feed.textContent=R.ok===0?"名單上有。小朋友揮揮手走了。":"電話打過去，家長說：「謝謝你們有先問！」";}
        else if(k===0){feed.textContent="不在名單上，你卻交出去了。";if(R.mi)handedMi=true;}
        else feed.textContent=R.ok===0?"名單上明明有，家長等得有點不耐煩。":"他在旁邊等著，但最後還是要打電話。";
        el.querySelectorAll("[data-k]").forEach((x,j)=>{x.disabled=true;if(j===R.ok)x.style.borderColor="var(--green)";});act.hidden=false;
        act.querySelector("[data-next]").onclick=()=>{if(i<self.rounds.length-1){i++;draw();}else{el.innerHTML=`<p class="feed">接送完了，處理得對的有 ${ok} / ${self.rounds.length} 位。</p>`;done({ok,handedMi});}};}));}
    draw();}
};

MINIS.vocab={
  head:"C 班・單字搶答",zone:"國中 C 班",title:"會考單字搶答",cost:5,
  intro:"五個會考常見單字，選出正確的中文意思。",
  qs:[["environment",["環境","娛樂","設備"],0],["necessary",["附近的","必要的","緊張的"],1],["decide",["決定","描述","裝飾"],0],["several",["嚴重的","幾個","分開的"],1],["borrow",["借入","煩惱","邊界"],0]],
  mount(el,done){let i=0,right=0;const self=this;
    function draw(){const q=self.qs[i];
      el.innerHTML=`<div class="paper"><div class="q">第 ${i+1} / ${self.qs.length} 題</div><div style="font-size:1.6rem;font-weight:700;font-family:var(--mono)">${q[0]}</div></div><div class="choices">${q[1].map((o,k)=>`<button class="choice" data-k="${k}">${o}</button>`).join("")}</div><p class="feed" aria-live="polite"></p><div class="actions" hidden><button class="go" data-next>下一題</button></div>`;
      const feed=el.querySelector(".feed"),act=el.querySelector(".actions");
      el.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>{if(!act.hidden)return;const k=+b.dataset.k;
        if(k===q[2]){right++;feed.textContent="台下：「我就說吧！」";}else feed.textContent=`台下：「蛤～」答案是「${q[1][q[2]]}」。`;
        el.querySelectorAll("[data-k]").forEach((x,j)=>{x.disabled=true;if(j===q[2])x.style.borderColor="var(--green)";});act.hidden=false;
        act.querySelector("[data-next]").onclick=()=>{if(i<self.qs.length-1){i++;draw();}else{el.innerHTML=`<p class="feed">五題，全班答對 ${right} 題。</p>`;done({right});}};}));}
    draw();}
};

function guideTarget(t){const m=targetOf(t);if(t&&t.npc){const u=npcs[t.npc].userData;if(u.path&&u.anchor)return{...m,x:u.anchor[0],z:u.anchor[1]};}return m;}
function targetOf(t){if(!t)return null;if(t.npc){const n=npcs[t.npc];return{x:n.position.x,z:n.position.z,h:n.userData.top+.8,name:CHARS[t.npc].name,kind:"npc",id:t.npc};}
  const s=SPOTS[t.spot];return{x:s.pos[0],z:s.pos[1],h:s.h+.5,name:s.name,kind:"spot"};}
function activeSides(){const list=SIDES[G.line.id]||[],ids=G.steps.map(s=>s.id);
  const mainNpc=G.steps[G.idx]&&G.steps[G.idx].target&&G.steps[G.idx].target.npc;
  return list.filter(sd=>!G.sidesDone[sd.id]&&!(mainNpc&&sd.target.npc===mainNpc)&&G.idx>=ids.indexOf(sd.from)&&G.idx<=ids.indexOf(sd.until)&&(!sd.avail||sd.avail(G)));}
function nearest(){
  const px=player.position.x,pz=player.position.z,d=(x,z)=>Math.hypot(x-px,z-pz),c=[];
  const m=targetOf(step().target);if(m){const dm=d(m.x,m.z);if(dm<1.9)c.push({dist:dm,type:"main",label:step().action||(m.kind==="npc"?`找${CHARS[m.id].name}`:`到${m.name}`)});}
  for(const sd of activeSides()){const t=targetOf(sd.target);if(t){const ds=d(t.x,t.z);if(ds<1.9)c.push({dist:ds,type:"side",sd,label:sd.action||`找${t.name}`});}}
  for(const it of ITEMS){if(itemMarks[it.id]&&!G.items.includes(it.id)){const di=d(it.pos[0],it.pos[1]);if(di<1.3)c.push({dist:di-.3,type:"item",it,label:"撿起來"});}}
  for(const id of chatTargets()){const n=npcs[id],dc=d(n.position.x,n.position.z);if(dc<1.5)c.push({dist:dc+.8,type:"chat",id,label:`聊聊・${CHARS[id].name}`});}
  // 其他人：至少可以打個招呼
  const chatIds=new Set(chatTargets()),mainId=m&&m.kind==="npc"?m.id:null;
  for(const id in npcs){const n=npcs[id];if(!n.visible||id===mainId||chatIds.has(id)||id===G.line.id)continue;const dn=d(n.position.x,n.position.z);if(dn<1.4)c.push({dist:dn+1.2,type:"greet",p:n,id,label:"打招呼"});}

  if(c.length){c.sort((a,b)=>a.dist-b.dist);return c[0];}
  for(const inf of INFO){if(d(inf.pos[0],inf.pos[1])<1.6)return{type:"info",inf,label:"看說明"};}
  return null;
}

function applyFx(fx){const out=[];for(const k in fx){if(!fx[k])continue;
  if(k in G.s){const b=G.s[k];G.s[k]=clamp(b+fx[k]);const dv=G.s[k]-b;if(dv)out.push(`<span class="d ${dv>0?"up":"down"}">${G.line.stats[k][0]} ${dv>0?"+":""}${dv}</span>`);}
  else G.h[k]=clamp((G.h[k]??50)+fx[k]);}
  return out.join("");}
function resolveChoice(c,onDone,arg){
  const a=arg!==undefined?arg:G;
  if(c.onResolve)c.onResolve(a);
  const fx=val(c.fx,a)||{},res=val(c.res,a),log=val(c.log,a);
  if(c.min)spend(c.min);if(c.set)Object.assign(G.f,c.set);if(log)G.log.push([G.time,log]);
  const deltas=applyFx(fx);renderHud();
  const pages=typeof res==="string"?[[null,res]]:res||[[null,"……"]];
  if(G.s.voice!==undefined&&G.s.voice>0&&G.s.voice<20&&!G.f.hoarse){G.f.hoarse=1;pages.push([null,"你的聲音開始沙啞了。"]);}
  const dead=G.line.dead?G.line.dead(G):(G.s.voice!==undefined&&G.s.voice<=0)||(G.s.hp!==undefined&&G.s.hp<=0);
  const chatId=dead?null:G.chatNpc;G.chatNpc=null;
  runDialog({pages,chatId,deltas:deltas||`<span class="d">沒有變化</span>`,endLabel:dead?"……":"好",noskip:true,onEnd:()=>dead?finish():onDone()});
}
function openStep(){
  if(step().onOpen)step().onOpen();
  const st=step();if(st.effect)startEffect(st.effect);const carry=G.idx===0&&G.line.carry&&G.day!==2?G.line.carry(G):[];if(st.id==="ev_rain")startRain(12);if(/phone|calls|ymom|bmom|ycalls|ot_group/.test(st.id))ring(2);let pages=val(st.pages,G);const choices=st.choices?val(st.choices,G):null;
  if(carry.length)pages=[...carry,...pages];
  if(G.due!=null&&G.clock>G.due+.5&&!st.auto){const late=Math.floor(G.clock-G.due),k=Math.min(3,Math.ceil(late/5));G.lates++;G.lateMin+=late;const lf=G.line.late||{};const fx={};for(const a in lf.fx||{})fx[a]=lf.fx[a]*k;const d=applyFx(fx);G.log.push([G.time,`遲到 ${late} 分鐘`]);pages=[[null,`你晚了 ${late} 分鐘。${lf.text||""}`],...pages];if(d)G.lateDeltas=d;renderHud();}
  spend(2);G.chatNpc=st.target&&st.target.npc;
  runDialog({pages,choices,chatId:choices?null:G.chatNpc,endLabel:st.endLabel,onEnd:choices?null:()=>{if(st.fx)applyFx(val(st.fx,G));if(st.set)Object.assign(G.f,st.set);nextStep();},
    onChoice:c=>{if(c.mini)runMini(c.mini,r=>resolveChoice(c,nextStep,r));else resolveChoice(c,nextStep);}});

function openSide(sd){

  runDialog({pages,choices,chatId:choices?null:G.chatNpc,onEnd:choices?null:()=>{if(sd.fx)applyFx(val(sd.fx,G));if(sd.set)Object.assign(G.f,sd.set);if(sd.log)G.log.push([G.time,"（支線）"+sd.log]);done();},
    onChoice:c=>{const go=r=>resolveChoice({...c,log:c.log?(a=>"（支線）"+val(c.log,a)):null},done,r);if(c.mini)runMini(c.mini,go);else go();}});
}

/* ---------- 下午 crowd：8 個小朋友，18:00 後高三開始進場 ---------- */
setKidCrowd=function(ph,instant,now,kids){
  // 劇情明定接 8 個：3 個有名字 + 5 個背景小朋友。多出的背景模型不參與本線。
  const activeKids=kids.slice(0,5),overflowKids=kids.slice(5);
  const hs=extras.filter(e=>e.kind==='class');
  const hide=e=>{e.p.visible=false;e.state='gone';e.p.userData.path=null;e.p.userData.act=null;};
  overflowKids.forEach(hide);
  extras.filter(e=>e.kind!=='kid'&&e.kind!=='class').forEach(hide);

  // 接送前，高三生不該提早坐在 B 班。
  if(ph!=='leave'&&ph!=='close')hs.forEach(hide);

  if(ph==='pre'){
    activeKids.forEach(hide);return;
  }
  if(ph==='class'){
    activeKids.forEach((e,i)=>{
      e.p.userData.act=null;
      if(e.p.visible||instant){e.p.visible=true;agentPlace(e.p,...e.home);e.state='seat';}
      else{e.state='toArrive';e.at=now+.5+i*1.2;}
    });return;
  }
  if(ph==='break'){
    let k=0;activeKids.forEach((e,i)=>{const u=e.p.userData;if(!e.p.visible)return;
      if(i%2===0){const sp=[[13.6,8.5],[15,9.6],[11,7.2],[10.6,4],[16.5,9.8]][k++%5];e.state='out';u.act=null;agentGo(e.p,sp[0],sp[1],Math.random()*6,()=>{u.act=pick(['cheer','wave','cup']);});}
      else u.act='cup';
    });return;
  }
  if(ph==='leave'||ph==='close'){
    activeKids.forEach((e,i)=>{
      if(e.state==='gone'||e.state==='exiting'||e.state==='leaving')return;
      if(!e.p.visible){e.state='gone';return;}
      e.state='leaving';e.p.userData.act=null;e.leaveAt=now+(ph==='close'?.3+i*.4:2+i*4);
    });

    // B 班晚課 18:30 開始。18:00 後讓高中生從門口逐批進來，而不是結尾只靠文字描述。
    hs.forEach((e,i)=>{
      if(instant){e.p.visible=true;agentPlace(e.p,...e.home);e.state='seat';return;}
      if(e.state==='seat'||e.state==='arriving'||e.state==='toArrive')return;
      e.p.visible=false;e.p.userData.path=null;e.p.userData.act=null;e.state='toArrive';
      const namedKidSeat=[PC.yuSeat,PC.ananSeat,PC.miSeat].some(s=>Math.hypot(e.home[0]-s[0],e.home[1]-s[1])<.35);
      e.at=now+1+i*.85+(namedKidSeat?10:0);
    });
  }
};

const CONS_BASE_TICK_CROWD=tickCrowd;

  if(G&&G.line.crowd!=='kids'){
    const now=clockT.elapsedTime;

/* ================= 一致性：劇情時間跳轉的人群補進度 =================
   劇情一步可一次跳過十幾個遊戲分鐘，但 agentGo 走路使用真實秒數。
   因此不能只用「visible」判斷到場，必須按遊戲內 G.clock 把人群狀態補到正確時間點。 */

function consCareClockSync(){
  if(!G||G.line.id!=='care')return;
  const ph=phaseOf();if(ph!=='leave'&&ph!=='close')return;
  const kids=extras.filter(e=>e.kind==='kid').slice(0,5);
  const hs=extras.filter(e=>e.kind==='class');

  // 未具名小朋友自 18:00 起陸續被接走。劇情走到 18:20 時不應還有背景小朋友滯留在場景其他角落。
  kids.forEach((e,i)=>{
    const leaveAt=18*60+i*1.35;
    if(G.clock>=leaveAt){
      e.p.visible=false;e.p.userData.path=null;e.p.userData.moving=false;e.p.userData.act=null;e.state='gone';
    }
  });

  // B 班 18:30 上課。18:00 起陸續進場，最晚約 18:15 已坐定。
  // 若劇情時鐘已越過某人的到班時間，就直接補到座位，避免畫面仍停留在二十個劇情分鐘以前。
  hs.forEach((e,i)=>{
    const arriveAt=18*60+i*.92; // 16 位背景生約在 18:14 前到齊
    if(G.clock>=arriveAt){
      if(e.state!=='seat'||!e.p.visible||e.p.userData.path){
        e.p.visible=true;e.p.userData.path=null;e.p.userData.moving=false;e.p.userData.act=null;
        agentPlace(e.p,...e.home);e.state='seat';
      }
    }else if(e.state==='gone'){
      e.p.visible=false;e.p.userData.path=null;e.p.userData.moving=false;e.p.userData.act=null;e.state='clockWait';
    }
  });
}

/* C 班 18:30 開始上課時，阿翔與子晴必須已經真正坐定位。
   j_xiang 18:10 會讓阿翔從置物區進場；若玩家很快完成事件，劇情時鐘可直接跳到 18:30，
   但真人走路動畫只過幾秒，因此需要在 j_class 入口把場景追上劇情時間。 */

  if(!G||G.line.id!=='jh')return;
  const st=step&&step();if(!st||st.id!=='j_class'||G.clock<18*60+30)return;

    n.visible=true;n.userData.path=null;n.userData.moving=false;n.userData.act=null;
    agentPlace(n,pos[0],pos[1],pos[2]);
  };
  place('xiang',PJ.xiangSeat);place('qing',PJ.qingSeat);
  extras.filter(e=>e.kind==='jh').forEach(e=>{
    if(e.state!=='seat'||!e.p.visible||e.p.userData.path){

      agentPlace(e.p,...e.home);e.state='seat';
    }
  });
}

  const url=c.toDataURL("image/png"),name=`十點下課-${G.line.role}.png`;
  const prev=mode;mode="info";
  openSheet("成績卡",`<img src="${url}" alt="成績卡：${esc(G.line.role)}・${esc(G.result.title)}" style="width:100%;border-radius:6px;display:block">
    <p class="hint">長按（或右鍵）圖片可以儲存。</p><div class="actions"><button class="primary" data-act="shareImg">分享</button>${document.querySelector('link[rel="manifest"]')?`<a class="ghost btnlink" download="${esc(name)}" href="${url}">下載圖片</a>`:""}</div>`,()=>{mode=prev;});
  const btn=$("sheet").querySelector("[data-act=shareImg]");
  btn.onclick=()=>{c.toBlob(b=>{const f=new File([b],name,{type:"image/png"}),text=`我在《晚上十點下課》當${G.line.role}，結局是「${G.result.title}」。`;
    try{if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],text,url:SHARE_URL}).catch(()=>{});
      else if(navigator.share)navigator.share({text,url:SHARE_URL}).catch(()=>{});
      else{navigator.clipboard.writeText(text+" "+SHARE_URL);btn.textContent="已複製連結";}}catch(e){btn.textContent="請長按圖片儲存";}},"image/png");};
}
/* PWA：只有獨立網頁版（有 manifest）才註冊 service worker */
if(document.querySelector('link[rel="manifest"]')&&"serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}

/* ================= 啟動 ================= */
try{buildWorld();buildNight();const L=LINES.teacher;for(const id in L.npcs)if(CHARS[id]&&CHARS[id].body!==undefined)setNPC(id,typeof L.npcs[id]==="function"?null:L.npcs[id],true);showTitle();tick();}
catch(err){const c=$("cover");c.hidden=false;c.innerHTML=`<div class="card"><h2>3D 場景載入失敗</h2><p>你的瀏覽器可能不支援 WebGL，或 3D 函式庫沒有載入。請換一個瀏覽器，或重新整理頁面再試一次。</p></div>`;console.error(err);}
/* HUD 高度一變，就把「下一步」卡片跟著往下推 */
try{const h=document.querySelector(".hud"),fit=()=>{$("next").style.top=h.offsetHeight+8+"px";};if(window.ResizeObserver)new ResizeObserver(fit).observe(h);addEventListener("resize",()=>{fit();renderDock();});}catch(e){}

})();
</script>
