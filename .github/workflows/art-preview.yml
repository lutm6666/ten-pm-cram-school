name: Art preview static site
on:
  push:
    branches: [art-overhaul-phase2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: art-preview-phase2-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Build visual-validation page
        run: python3 build.py --dbg https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js tests/shots.html
      - name: Capture visual-validation screenshots
        run: OUT=art-preview-shots node tests/shots.js
      - uses: actions/upload-artifact@v4
        with:
          name: art-preview-screenshots
          path: art-preview-shots/
          retention-days: 3
      - name: Build preview
        run: python3 build.py
      - name: Assemble preview branch
        run: |
          rm -rf preview-out
          mkdir preview-out
          cp index.html preview-out/
          cp manifest.webmanifest preview-out/
          cp sw.js preview-out/
          cp -R assets preview-out/
          printf '%s\n' 'Art preview for ${GITHUB_SHA}' > preview-out/README.txt
      - name: Publish preview branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/art-overhaul-phase2 | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "Skipping outdated preview $GITHUB_SHA; latest is $latest"
            exit 0
          fi
          cd preview-out
          git init -q -b art-preview-site
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "art preview for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" art-preview-site
